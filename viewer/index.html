ed_receipt_date": "2026-10-07", "initial_confirmed_receipt_date": "2026-10-10", "ordered_qty": 100, "unit_price_pence": 3000, "net_value_pence": 300000, "cancelled": 0, "cancelled_date": "", "partial_allowed": 1, "exception": "None", "shipped_qty": 100, "received_qty": 100, "full_receipt_date": "2026-10-08", "customer_name": "Fictional UK Customer 06", "product_name": "Mounting rail"}, {"order_id": "NS-ORD-1300", "customer_id": "CUST-020", "product_id": "PROD-001", "warehouse_id": "WH-01", "received_date": "2026-07-20", "requested_receipt_date": "2026-07-25", "initial_confirmed_receipt_date": "2026-07-26", "ordered_qty": 20, "unit_price_pence": 2500, "net_value_pence": 50000, "cancelled": 0, "cancelled_date": "", "partial_allowed": 1, "exception": "Customer data correction", "shipped_qty": 20, "received_qty": 20, "full_receipt_date": "2026-07-26", "customer_name": "Fictional UK Customer 20", "product_name": "Standard mounting bracket"}], "docs": [{"path": "README.md", "html": "<h1>NorthStar Manufacturing UK — Order-to-Cash portfolio<\/h1>\n<p><strong>Independent simulated portfolio · AI-assisted · 11 October 2026<\/strong><\/p>\n<p>A complete artifact pack for learning business analysis through a fictional one-company, one-warehouse domestic stock-sales process. No real client engagement, production configuration, measured savings or SAP implementation experience is claimed.<\/p>\n<h2>Start here<\/h2>\n<p>1. Download and extract the supplied GitHub-ready ZIP, or use GitHub&#x27;s Code → Download ZIP when viewing the repository.<\/p>\n<p>2. Run <code>python scripts/serve.py --open<\/code> and visit <code>http://127.0.0.1:8000/<\/code>. The app includes document reading, synthetic KPI cards, order details, requirements, UAT and evidence. Root index.html is also self-contained for browsers allowing file URLs. No account, API key or paid service is required.<\/p>\n<p>3. Open the editable workbook <small>(downloads/NorthStar_Complete_Workbook.xlsx)<\/small> in LibreOffice Calc, the report <small>(downloads/NorthStar_Portfolio_Report.docx)<\/small> in Writer and the ten-slide presentation <small>(downloads/NorthStar_Executive_Presentation.pptx)<\/small> in Impress. Microsoft Office is optional. Rendering may vary; Office files were programmatically checked, not visually verified in LibreOffice. Real portfolio UI browser checks and screenshots are separately recorded in quality/browser-checks.json.<\/p>\n<p>4. Read the project guide with screenshots (PDF) <small>(downloads/NorthStar_Project_Guide.pdf)<\/small>, full portfolio reference (PDF) <small>(downloads/NorthStar_Full_Portfolio.pdf)<\/small>, local setup <small>(RUN_LOCALLY.md)<\/small>, GitHub Pages setup <small>(GITHUB_SETUP.md)<\/small>, quality gate <small>(quality/final-quality-gate.md)<\/small> and contribution limits <small>(phase-12/interview-and-resume.md)<\/small>.<\/p>\n<h2>What is working<\/h2>\n<p>This is a read-only portfolio application, not an operational SAP/ERP backend. Search and filter orders, export CSV, inspect linked records, explore requirements and tests, switch process maps and read documents. Creating orders, reserving stock, posting invoices and clearing actual payments are proposed business behaviours documented in the portfolio; they are not implemented transactions in the browser. See what was built <small>(PROJECT_GUIDE.md)<\/small>.<\/p>\n<h2>GitHub access<\/h2>\n<p>Push the extracted folder contents to a public repository with index.html at its root. Then enable Settings → Pages → Deploy from a branch → main → /(root). The root entry and .nojekyll are supplied. Pushing alone does not enable Pages; no live deployment is claimed. This route uses GitHub Pages for public repositories on GitHub Free; official sources and setup steps are in GITHUB_SETUP.md. Generated ZIPs are ignored by Git to keep the repository clean.<\/p>\n<h2>Evidence boundary<\/h2>\n<p>- Supplied facts: learner background and fictional scenario scope. Invented business detail is labelled assumption or role-play.<\/p>\n<p>- SAP reference: Public Edition 2602; official URLs/access dates and uncertainties in SAP evidence <small>(phase-05/sap-evidence.csv)<\/small>. Documentation is not demonstrated capability.<\/p>\n<p>- Executed: synthetic generation, Python/SQLite KPI reconciliation, fixture/data checks and artifact consistency checks.<\/p>\n<p>- Not executed: all 22 SAP UAT cases. No fabricated defects, approvals, interviews or system screenshots.<\/p>\n<p>- Pending: learner understanding and actual personal contribution review; business validation, tenant configuration and testing. Artifact preparation does not equal the original final learning gate or production readiness.<\/p>\n<h2>Contents<\/h2>\n<div class=\"scroll\"><table><thead><tr><th>Folder<\/th><th>Contents<\/th><\/tr><\/thead><tbody><tr><td>phase-01<\/td><td>Starting charter, schedule, base order and free route; original statements carry a supersession note<\/td><\/tr><tr><td>phase-02<\/td><td>Stakeholders, interview guide, role-play findings and responsibilities<\/td><\/tr><tr><td>phase-03<\/td><td>AS-IS flowchart, step register and root-cause hypotheses<\/td><\/tr><tr><td>phase-04<\/td><td>BRD, 23 requirements, 12 rules, access and traceability<\/td><\/tr><tr><td>phase-05<\/td><td>TO-BE flowchart, SAP evidence and data/control design<\/td><\/tr><tr><td>phase-06<\/td><td>Desk-based fit-gap assessment<\/td><\/tr><tr><td>phase-07<\/td><td>15-story backlog and separate analysis tasks<\/td><\/tr><tr><td>phase-08<\/td><td>300-order synthetic dataset, dictionary, model, six KPI contracts, SQL and results<\/td><\/tr><tr><td>phase-09<\/td><td>22 unexecuted UAT cases, plan and desk-based design walkthrough<\/td><\/tr><tr><td>phase-10<\/td><td>Ten risks, role change/training/support and illustrative option/cost analysis<\/td><\/tr><tr><td>phase-11<\/td><td>Case study and executive presentation source<\/td><\/tr><tr><td>phase-12<\/td><td>Conditional resume descriptions, interview scripts and coaching rubric<\/td><\/tr><tr><td>registers<\/td><td>Current decisions, assumptions, glossary and progress<\/td><\/tr><tr><td>quality<\/td><td>Executed checks, fixture oracle and remaining gates<\/td><\/tr><tr><td>viewer<\/td><td>Offline browser interface, not SAP software<\/td><\/tr><tr><td>scripts<\/td><td>Reproducible free-tool build scripts<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Each phase has a short practical task and three understanding questions. The user authorized building all phases at once; no learner answers or mastery are inferred.<\/p>\n<h2>Reproduce with free tools<\/h2>\n<p>Python 3.11+ and Node.js 18+ are recommended for the full build. Install the packages in requirements.txt if needed, then run <code>python scripts/build_all.py<\/code> from this folder. Node runs local viewer logic checks only; it is not needed to open the viewer. Data generation itself uses the Python standard library: <code>python scripts/build_data.py<\/code>. SQLite queries are in phase-08/kpi_queries.sql. Graphviz <code>dot<\/code> is optional for regenerating process SVGs; supplied SVGs remain usable if unavailable. No network access is needed to rerun the build once tools are installed. Official SAP source links require internet only when opened.<\/p>\n<p>Markdown, CSV and authored Python are the source of truth. Reconcile edits made directly in Office-compatible copies before rebuilding, which overwrites generated outputs. The builder does not publish or deploy anything. The earlier Phase 1 downloads are historical snapshots, not the current full project.<\/p>\n<h2>Free route<\/h2>\n<p>Required incremental software purchases: £0 using an existing device and free tools. This is not a promise about charges for this chat/cloud environment or internet access. No paid SAP practice tenant, training, Power BI sharing, domain or hosting is needed. The illustrative business case models a separate fictional organization&#x27;s potential costs.<\/p>\n<h2>Personal contribution<\/h2>\n<p>AI generated the draft artifacts and ran the recorded checks. The learner should review, revise, reproduce and explain them before claiming personal analysis or testing achievements. See phase-12/interview-and-resume.md for conditional wording and an honest AI-use explanation. No employment outcome is guaranteed.<\/p>"}, {"path": "PROJECT_GUIDE.md", "html": "<h1>What was built — NorthStar project guide<\/h1>\n<p>Independent simulated portfolio. Initial build 11 October 2026; handover refreshed 12 October 2026. This guide describes actual artifacts and clearly separates the running portfolio application from a future SAP implementation. The synthetic data snapshot remains 11 October 2026.<\/p>\n<h2>1. The direct answer<\/h2>\n<p>Yes: the twelve-phase <strong>artifact pack<\/strong> and a <strong>read-only, interactive portfolio application<\/strong> have been built. You can run the application locally, inspect records and analysis, read the documents, and publish the static application using GitHub Pages after uploading the repository and enabling Pages.<\/p>\n<p>No: this is not a working SAP ERP implementation or a transactional order-management backend. Creating orders, reserving stock, enforcing credit approvals, posting goods issue, issuing legally valid invoices and clearing real payments are requirements/design scenarios in the portfolio. They are not executable business transactions in this app.<\/p>\n<p>The earlier phrase “full project built” referred to the artifact pack and viewer. It did not mean a production ERP system, completed SAP UAT or verified learner mastery. Those distinctions are essential to honest portfolio use.<\/p>\n<h2>2. What you can actually do in the application<\/h2>\n<div class=\"scroll\"><table><thead><tr><th>Screen<\/th><th>Implemented behaviour<\/th><th>Boundary<\/th><\/tr><\/thead><tbody><tr><td>Overview<\/td><td>Six calculated synthetic KPI cards, exclusions and representative order link<\/td><td>Snapshot, not live business performance<\/td><\/tr><tr><td>Orders<\/td><td>Search by order/customer/issue; status filter; export filtered CSV; open linked delivery/invoice/allocation detail<\/td><td>Read-only records; no order creation or modification<\/td><\/tr><tr><td>Process maps<\/td><td>Switch between AS-IS and TO-BE SVG flowcharts<\/td><td>Proposed process logic, not a workflow execution engine<\/td><\/tr><tr><td>Requirements<\/td><td>Search 23 requirements and inspect acceptance, dependencies and trace links<\/td><td>Proposed requirements, not stakeholder-approved scope<\/td><\/tr><tr><td>Data &amp; KPIs<\/td><td>Inspect a chart, formulas, populations and limitations<\/td><td>Generated snapshot; filters on the order list do not recalculate cards<\/td><\/tr><tr><td>UAT &amp; checks<\/td><td>Expand 22 test designs with prerequisites, steps and expected results<\/td><td>Every SAP case remains Not executed<\/td><\/tr><tr><td>SAP evidence<\/td><td>Read nine source-register entries and open official links<\/td><td>Seven reviewed sources, two unverified pages; no tenant demonstration<\/td><\/tr><tr><td>Document library<\/td><td>Select embedded phase documents and download PDF/workbook/presentation/setup files<\/td><td>Download files require the complete project folder or hosted repository<\/td><\/tr><\/tbody><\/table><\/div>\n<p>There are no logins, roles enforced by the app, live SAP APIs, cloud databases, payment services or secret keys. The role-access matrix describes a proposed business control; it is not implemented authentication. The SQLite database is an analytical output for local inspection, not a backend used by the browser.<\/p>\n<h2>3. What work was done<\/h2>\n<p>- Converted the supplied scope into a charter, representative order, learning plan and maintained registers.<\/p>\n<p>- Created explicitly simulated stakeholder discovery and mapped conflicting needs to proposed policies.<\/p>\n<p>- Built AS-IS and TO-BE flowcharts with ownership, handoffs and exceptions; separated hypotheses from proven causes.<\/p>\n<p>- Authored 3 business, 15 functional and 5 non-functional requirements, 12 business rules, 15 stories and 22 UAT cases; linked them using stable IDs.<\/p>\n<p>- Reviewed official SAP sources and pinned the reference to S/4HANA Cloud Public Edition 2602; recorded access dates and uncertainty.<\/p>\n<p>- Built a reproducible 300-order synthetic dataset with separate customer, product, order, delivery, invoice, receipt, allocation and event tables.<\/p>\n<p>- Implemented six KPI calculations in Python and independently in SQLite; executed 24 data checks and a hand-calculated fixture.<\/p>\n<p>- Built a ten-risk register, role change/training/support plan and illustrative option comparison that separates capacity from cash savings.<\/p>\n<p>- Created an offline HTML/CSS/JavaScript portfolio viewer, editable workbook and report, ten-slide presentation, case study and conditional interview/resume pack.<\/p>\n<p>- Added local serving, root website entry, GitHub Pages preparation, real-browser checks, screenshot evidence and PDF handover materials.<\/p>\n<p>AI performed the drafting, coding and recorded tool execution in this conversation. Your personal contribution so far is supplying the brief, scope, background and preferences. You have not yet demonstrated independent review or reproduction here. Update that statement as you do the practical tasks; do not claim personal implementation/testing work merely because artifacts exist.<\/p>\n<h2>4. All twelve phases and their outputs<\/h2>\n<div class=\"scroll\"><table><thead><tr><th>Phase<\/th><th>What is present<\/th><th>What remains<\/th><\/tr><\/thead><tbody><tr><td>1 Charter<\/td><td>Scope, objectives, assumptions, decisions, schedule, NS-ORD-1001<\/td><td>Tailoring to actual study time and primary target role<\/td><\/tr><tr><td>2 Discovery<\/td><td>Stakeholder matrix, questions, role-play, findings and RACI<\/td><td>Real stakeholder engagement<\/td><\/tr><tr><td>3 AS-IS<\/td><td>Flowchart, eight-step register and root-cause hypotheses<\/td><td>Validate current process and causes with evidence<\/td><\/tr><tr><td>4 Requirements<\/td><td>BRD, 23 requirements, 12 rules, access and traceability<\/td><td>Business review and policy approval<\/td><\/tr><tr><td>5 TO-BE/SAP<\/td><td>Future flow, controls, data needs and source register<\/td><td>Tenant-specific feasibility and settings<\/td><\/tr><tr><td>6 Fit-gap<\/td><td>Fifteen functional desk assessments plus NFR discussion<\/td><td>System demonstrations against criteria<\/td><\/tr><tr><td>7 Backlog<\/td><td>Fifteen stories with criteria, dependencies and exceptions<\/td><td>Delivery planning and implementation<\/td><\/tr><tr><td>8 Analysis<\/td><td>300 orders, dictionary/model, six KPIs, SQL, checks and charts<\/td><td>Broader real data and baseline validation<\/td><\/tr><tr><td>9 UAT<\/td><td>Twenty-two cases, criteria/severity and design walkthrough<\/td><td>SAP execution and user acceptance<\/td><\/tr><tr><td>10 Change/case<\/td><td>Ten risks, role impacts, training/support and scenario costs<\/td><td>Agreed operating model and business case<\/td><\/tr><tr><td>11 Packaging<\/td><td>README, viewer, editable files, deck and case study<\/td><td>Optional GitHub publication by you<\/td><\/tr><tr><td>12 Coaching<\/td><td>Conditional project descriptions, interview scripts and questions<\/td><td>Your answers, feedback and mastery review<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>5. How the project works technically<\/h2>\n<p>The source files are Markdown documents, CSV catalogues, authored Python, JavaScript and CSS. Python generates deterministic synthetic tables and calculations, then builds the viewer by embedding a JSON snapshot and the documents into HTML. That file runs in the browser without a backend. The same static files can be served locally or by GitHub Pages.<\/p>\n<p>Flow: authored catalogues and generator → CSV / SQLite / calculated results → generated HTML and editable reports → browser exploration. No browser action writes to the original CSVs. Editing the workbook alone does not update the viewer. To change its source data or generated documents consistently, modify source inputs and run the build scripts again.<\/p>\n<p>Root index.html, viewer/index.html and downloads/NorthStar_Offline_Portfolio.html are generated copies of the same app. The root copy makes local and GitHub Pages entry straightforward. Source JavaScript and CSS stay in viewer/app.js and viewer/style.css. This intentional duplication supports a portable single-file app as well as an editable repository.<\/p>\n<h2>6. Data and KPI interpretation<\/h2>\n<p>The dataset contains 300 orders, 285 deliveries, 262 invoices, 209 receipts and 197 allocations. It includes split deliveries, partial payments, open orders and unmatched receipts. Dates are synthetic UK business-local calendar dates with a snapshot of 11 October 2026. Amounts use integer pence; invoices and receipts are net-only and omit VAT. One line per order is a teaching simplification.<\/p>\n<p>The six full-cohort results are: cycle time 6.16 calendar days; on-time delivery 49.07%; quantity fulfilment 84.89%; billing cycle 1.95 calendar days; order error rate 22.33%; manual-touch rate 76.33%. These are properties of generated data, not actual NorthStar results or achieved improvements.<\/p>\n<p>Cycle time includes 232 fully received orders and excludes 51 open noncancelled orders. On-time delivery counts 132 successes among 269 due initial promises, including overdue open failures. One unknown promise is separately disclosed. Billing cycle covers 262 invoiced deliveries and excludes 22 goods-issued unbilled deliveries. Read the KPI contract before interpreting any number.<\/p>\n<p>The model aggregates child records before combining order measures. A delivery × payment join can otherwise multiply values. A partial payment&#x27;s analytical remaining balance is not proof that an SAP invoice has been cleared.<\/p>\n<h2>7. How to run it locally<\/h2>\n<p>Extract the repository ZIP, open a terminal in the northstar-otc folder and run <code>python scripts/serve.py --open<\/code>. Visit <code>http://127.0.0.1:8000/<\/code> if it does not open. Windows can use <code>py<\/code>; macOS/Linux may use <code>python3<\/code>. The server needs only Python&#x27;s standard library and stops with Ctrl+C.<\/p>\n<p>Double-clicking index.html is also an intended offline path for browsers allowing file URLs. This environment&#x27;s browser policy blocks that protocol, so actual verification used local HTTP. Refer to RUN_LOCALLY.md for alternatives, the five-minute tour, rebuild commands and troubleshooting.<\/p>\n<h2>8. GitHub access and the free route<\/h2>\n<p>Push the complete folder contents to a new public repository. Keep index.html at the root. Enable Settings → Pages → Deploy from a branch → main → /(root). After deployment, use the actual URL GitHub displays. A typical project URL has the form https://YOUR_USERNAME.github.io/northstar-otc/; this is a format example, not an existing deployed site.<\/p>\n<p>GitHub Pages can host this static project from a public repository on GitHub Free. The one-time Pages setup is needed; pushing alone is insufficient. GITHUB_SETUP.md includes exact commands, GitHub Desktop guidance and official sources accessed on 11 October 2026. No custom domain or paid service is required for this planned route. Existing device, internet and chat/cloud costs are separate.<\/p>\n<p>Nothing has been pushed to your account or deployed by this handover. GitHub hosting must be checked after your own deployment.<\/p>\n<h2>9. Verification and screenshot meaning<\/h2>\n<p>Python/SQLite data checks and catalogue consistency checks are recorded in quality and phase-08/data. Node smoke checks verify viewer logic. Real Chromium UI checks, when present, are recorded separately in quality/browser-checks.json with the tested HTML hash, browser version and screenshot references. Screenshots in the handover PDF come from that running local portfolio, not the earlier generated concept image and not SAP software.<\/p>\n<p>The browser exercise covers navigation, search, filters, CSV download, record detail, requirement links, UAT expansion, process switching, evidence, document selection, download links, repository-prefix paths and a mobile viewport. It is not a comprehensive security/accessibility certification or real SAP UAT. No real business users were interviewed or tested. LibreOffice visual rendering is not verified.<\/p>\n<h2>10. What “complete” means here<\/h2>\n<p>The twelve-phase artifact pack and defined read-only viewer are built. Their exact execution checks and remaining limits are reported, rather than calling them production ready. The original final learning gate stays open until you can explain the decisions, calculations and your personal contribution independently. The files do not prove a live SAP implementation or guarantee employment.<\/p>\n<p>Turning this into a transactional ERP application would be a separate software-development scope: persistence, authenticated roles, transaction rules, inventory/reservation logic, accounting semantics, integrations, security, operational support and system acceptance. That work is neither required for this BA portfolio nor silently claimed as completed.<\/p>\n<h2>11. Where to start learning<\/h2>\n<p>Read Phase 1 and explain why 60 on hand cannot confirm 100 requested. Follow FR-004 through its story and tests. Recalculate the four-order fixture. Explain physical dispatch versus posting versus receipt. Then work through the short task and three questions in each phase. Resume wording should evolve only as you personally review, change, reproduce and explain the work.<\/p>\n<h2>12. Handover files<\/h2>\n<p>The Project Guide PDF explains the build, real screenshots, local use and GitHub setup. The Full Portfolio PDF supplies the narrative documents and detailed catalogue appendices. Editable originals and raw synthetic data remain in the repository because PDFs are not a suitable replacement for executable scripts or tabular source data. All formats are readable with free tools.<\/p>"}, {"path": "RUN_LOCALLY.md", "html": "<h1>Run the project locally<\/h1>\n<p>The portfolio application is prebuilt. Viewing it does not require SAP, a database server, an account, npm packages or paid software. The editable workbook is a snapshot; it does not recalculate the browser data when changed.<\/p>\n<h2>Recommended: local web server<\/h2>\n<p>1. Extract the repository ZIP and open the <code>northstar-otc<\/code> folder. Keep the entire folder together.<\/p>\n<p>2. Open a terminal inside that folder.<\/p>\n<p>3. Run <code>python scripts/serve.py --open<\/code> (on Windows you may use <code>py scripts/serve.py --open<\/code>; on macOS/Linux, <code>python3 scripts/serve.py --open<\/code>).<\/p>\n<p>4. If the browser does not open automatically, visit <code>http://127.0.0.1:8000/<\/code>.<\/p>\n<p>5. Press Ctrl+C in the terminal when finished. If the port is occupied, run with <code>--port 8001<\/code>.<\/p>\n<p>Python&#x27;s standard library is enough for this server. Internet is unnecessary for the application itself; official SAP source links open external sites when selected. No records are written by the application. CSV export saves a file in your browser&#x27;s download location.<\/p>\n<h2>Without Python<\/h2>\n<p>Double-click <code>index.html<\/code> in a modern browser. All interactive data and documents are embedded; no fetch calls or backend are required. Some managed browsers block file URLs. If that happens, use the local-server option or GitHub Pages. File-URL execution was blocked by this environment&#x27;s browser policy; actual Chromium verification used HTTP on loopback. Do not interpret that policy restriction as a passed file-URL test.<\/p>\n<h2>Five-minute tour<\/h2>\n<p>1. Overview: read the six KPI cards and the denominator context.<\/p>\n<p>2. Orders: search <code>NS-ORD-1001<\/code>; open it and notice that 60 on hand is not a confirmed promise. Filter other orders by fulfilment status and export the filtered CSV.<\/p>\n<p>3. Requirements: search <code>FR-004<\/code>; inspect the story/test/KPI chain for partial delivery.<\/p>\n<p>4. UAT: expand <code>TC-005<\/code> and <code>TC-006<\/code>; both remain Not executed in SAP.<\/p>\n<p>5. Process maps: switch AS-IS and TO-BE.<\/p>\n<p>6. Data &amp; KPIs: inspect formulas and limitations; the cards remain full-cohort when the order list is filtered.<\/p>\n<p>7. SAP evidence: distinguish reviewed sources from two unverified pages.<\/p>\n<p>8. Document library: read each phase and download the PDF/workbook/presentation.<\/p>\n<h2>Rebuild instead of just viewing<\/h2>\n<p>Only contributors regenerating the data, charts and editable reports need the build tools. Install Python 3.11+ and Node.js 18+, then <code>python -m pip install -r requirements.txt<\/code> and <code>python scripts/build_all.py<\/code>. Graphviz is optional if the supplied rendered maps are retained. The Python data-only command is <code>python scripts/build_data.py<\/code>.<\/p>\n<p>Optional real-browser checks and screenshot refresh require <code>python -m pip install -r requirements-browser.txt<\/code> plus an installed Chromium browser. Run <code>python scripts/browser_check.py --browser-path /path/to/chromium<\/code>. That script creates a temporary local server, tests the app and closes both server and browser. It does not run SAP UAT. Windows Chrome is usually inside Program Files; provide its executable path if using it. Browser automation is optional for viewing or GitHub hosting.<\/p>\n<p>After capturing screenshots, <code>python scripts/build_handover.py<\/code> regenerates the explanatory and full-reference PDFs. Run <code>python scripts/package_release.py<\/code> last to update the ZIPs. Regeneration overwrites generated files; reconcile direct Word/Excel edits with source Markdown/CSV/Python first.<\/p>\n<h2>Troubleshooting<\/h2>\n<p>- A blank page: use a current browser with JavaScript enabled; try the local server. Inspect the browser console and compare quality/browser-checks.json.<\/p>\n<p>- Opening README shows text, not the app: open root <code>index.html<\/code> or the local URL.<\/p>\n<p>- PDF link unavailable: confirm the full repository&#x27;s downloads folder was extracted. A lone HTML copy keeps the app data but cannot carry separate downloadable files.<\/p>\n<p>- Data edits do not appear: rebuild the viewer; it contains a generated snapshot rather than reading live CSVs.<\/p>\n<p>- Changes disappear on rebuild: edit the source scripts, Markdown or CSV generation inputs, not only generated HTML/Office copies.<\/p>"}, {"path": "GITHUB_SETUP.md", "html": "<h1>Push to GitHub and open the website<\/h1>\n<p>GitHub stores the whole repository. GitHub Pages serves its static browser application. Pushing files alone does not enable Pages; the publishing source must be selected once.<\/p>\n<h2>Free route<\/h2>\n<p>Use a <strong>public repository<\/strong> with GitHub Free and the default github.io address. No custom domain, SAP subscription or paid backend is needed. The repository contains synthetic records and simulated analysis. The site and source will be public, so add only information you intend to share. The chat/cloud workspace&#x27;s own pricing is separate.<\/p>\n<h2>Option A — Git commands<\/h2>\n<p>Create a new empty public repository named <code>northstar-otc<\/code> on GitHub. Extract this project&#x27;s ZIP and open a terminal inside the folder containing index.html, README.md, viewer and scripts. Replace YOUR_USERNAME in the remote URL below.<\/p>\n<pre>git init\ngit add .\ngit commit -m &quot;Add simulated NorthStar OTC portfolio&quot;\ngit branch -M main\ngit remote add origin https://github.com/YOUR_USERNAME/northstar-otc.git\ngit push -u origin main<\/pre>\n<p>Authenticate using your normal GitHub/Git credential workflow. Do not put tokens in source files. If a remote already exists, inspect it with <code>git remote -v<\/code> before changing anything. The downloaded folder contains no .git history, credentials or configured remote.<\/p>\n<h2>Option B — GitHub Desktop<\/h2>\n<p>Create a repository from the extracted project folder in GitHub Desktop, make the initial commit and choose Publish repository. Select public visibility for the GitHub Free Pages route. Ensure <code>index.html<\/code> is at the repository root, not inside an extra nested northstar-otc folder.<\/p>\n<h2>Enable Pages once<\/h2>\n<p>In the repository, open Settings → Pages. Under Build and deployment, choose <strong>Deploy from a branch<\/strong>, select <strong>main<\/strong> and <strong>/(root)<\/strong>, then Save. Wait for GitHub&#x27;s deployment result. The usual project URL is <code>https://YOUR_USERNAME.github.io/northstar-otc/<\/code>; copy the actual URL shown by GitHub. Subsequent pushes to the selected branch update the site.<\/p>\n<p>The root index.html is self-contained. Relative file links work under a repository subpath. The supplied .nojekyll prevents Jekyll processing; no Node/Python build is needed to host the prebuilt application. No GitHub Actions deployment workflow is required for this route. The repository ignores generated ZIP archives to avoid recursively committing release bundles; PDFs, screenshots, code, data and editable reports remain included.<\/p>\n<h2>Check your deployed site<\/h2>\n<p>Open the actual Pages URL, navigate all sections, search NS-ORD-1001, export a CSV, open a PDF and test on a phone. GitHub deployment has not been run or verified by this handover. Local testing does not claim a live URL exists.<\/p>\n<h2>Sources checked 11 October 2026<\/h2>\n<p>- GitHub Pages availability and static hosting: https://docs.github.com/en/pages/getting-started-with-github-pages/what-is-github-pages<\/p>\n<p>- Publishing from a branch and root folder: https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site<\/p>\n<p>The first source confirms GitHub Free supports Pages for public repositories. The second describes the branch/folder configuration above. Future GitHub product or account changes should be checked against the official documentation.<\/p>"}, {"path": "phase-01/charter.md", "html": "<h1>Phase 1 — Project charter<\/h1>\n<blockquote>Supersession note — 11 October 2026: the user authorized building all phases. This Phase 1 draft is retained as the starting charter. Current status and decisions are in ../registers/progress.md and ../registers/decisions.md. Public Edition 2602 is now the research reference. Initial “not started” and evidence-pending statements below describe 8 October, not the current artifact set.<\/blockquote>\n<p>Version 0.1 | 8 October 2026 | Independent simulation | Draft; learner review pending<\/p>\n<h2>Executive summary<\/h2>\n<p>NorthStar Manufacturing UK is a fictional company selling stocked manufactured products to domestic business customers. The project examines poor order visibility, stock-related fulfilment delays and late billing caused by manual handoffs.<\/p>\n<p>The work will describe the current process, investigate potential causes, define requirements and propose a future process informed by official SAP sources. Synthetic analysis and honest validation records will support a portfolio for junior Business Analyst, ERP Business Analyst and Process Analyst roles. The primary target role is unresolved.<\/p>\n<p>Order-to-Cash means the journey from receiving a customer order through collecting and matching its payment. The project demonstrates analysis, not production readiness or an implemented transformation.<\/p>\n<h2>Business problems<\/h2>\n<p>Problems are supplied scenario facts. Consequences and causes below are hypotheses, not observed findings.<\/p>\n<div class=\"scroll\"><table><thead><tr><th>ID<\/th><th>Problem<\/th><th>Potential operational consequences<\/th><th>Evidence needed in a real business<\/th><\/tr><\/thead><tbody><tr><td>PROB-001<\/td><td>Poor order visibility<\/td><td>Repeated status enquiries; delayed orders overlooked; unclear ownership<\/td><td>Enquiry logs, order histories, ageing reports<\/td><\/tr><tr><td>PROB-002<\/td><td>Stock-related fulfilment delays<\/td><td>Missed promises; partial deliveries; replanning effort<\/td><td>Stock commitments, promised dates, delivered quantities<\/td><\/tr><tr><td>PROB-003<\/td><td>Late billing caused by manual handoffs<\/td><td>Dispatched orders wait for billing; payment period starts later<\/td><td>Dispatch evidence, posting timestamps, invoice dates, handoff records<\/td><\/tr><\/tbody><\/table><\/div>\n<p>An overdue invoice is a symptom. Unclear billing ownership is a possible cause requiring evidence. Simulated discovery will not be presented as actual stakeholder research.<\/p>\n<h2>Objectives and proposed business measures<\/h2>\n<div class=\"scroll\"><table><thead><tr><th>Objective<\/th><th>Candidate measures<\/th><th>Business target<\/th><\/tr><\/thead><tbody><tr><td>Make order progress and exception ownership visible<\/td><td>Manual-touch rate; ability to identify open order status and owner<\/td><td>Unresolved<\/td><\/tr><tr><td>Improve stock-related fulfilment decisions<\/td><td>On-time delivery percentage; order fulfilment rate<\/td><td>Unresolved<\/td><\/tr><tr><td>Reduce avoidable billing delays<\/td><td>Billing cycle time<\/td><td>Unresolved<\/td><\/tr><tr><td>Improve order quality and flow<\/td><td>Order error rate; order cycle time<\/td><td>Unresolved<\/td><\/tr><\/tbody><\/table><\/div>\n<p>KPI formulas, date bases, denominators and exclusions will be agreed before analysis. Targets require a baseline, customer commitments, capacity and cost assumptions. Synthetic results can inform illustrative targets but cannot establish real performance or achieved improvements.<\/p>\n<h2>Scope<\/h2>\n<p>- One fictional company and one warehouse; GBP reporting currency.<\/p>\n<p>- Domestic business customers buying stocked manufactured products.<\/p>\n<p>- Customer order → sales order validation → availability check → fulfilment → delivery and goods issue → billing → payment allocation → reporting.<\/p>\n<p>- Sales, Warehouse, Finance, Customer Service and IT stakeholders.<\/p>\n<p>- Data quality, access permissions, auditability, reporting timeliness, usability and process ownership where relevant.<\/p>\n<p>- Exceptions: missing/incorrect customer data; insufficient stock; partial delivery; credit/order block; order cancellation; incorrect invoice; partial/unmatched payment.<\/p>\n<p>Excluded initially: manufacturing planning, procurement redesign, international trade, complex tax configuration, full migration and production deployment. Record dependencies rather than silently expanding scope. Basic invoice/tax-data needs remain relevant.<\/p>\n<h2>Physical events and system postings<\/h2>\n<p>A physical event happens in the operation. A system posting records an event or its accounting consequences. Picking removes goods from storage; dispatch sends goods out of the warehouse; customer receipt occurs when the customer receives them. A goods-issue posting records an outbound stock movement in the system. Billing creates an invoice; payment allocation matches received money to an invoice or account.<\/p>\n<p>These events can occur at different times. A goods-issue record alone does not prove customer receipt. Later KPI definitions must distinguish dispatch from receipt. These are introductory business definitions; exact SAP behaviour requires edition-specific verification.<\/p>\n<h2>Stakeholder overview<\/h2>\n<p>These are proposed fictional responsibilities, not interviewed people or recorded approvals.<\/p>\n<div class=\"scroll\"><table><thead><tr><th>Role<\/th><th>Proposed responsibility<\/th><th>Interest<\/th><\/tr><\/thead><tbody><tr><td>Sales<\/td><td>Validate commercial order information; communicate delivery commitments<\/td><td>Reliable promises and straightforward processing<\/td><\/tr><tr><td>Warehouse<\/td><td>Pick, pack, dispatch and record fulfilment information<\/td><td>Clear priorities and accurate quantities<\/td><\/tr><tr><td>Finance<\/td><td>Credit-control policy, billing oversight and payment allocation<\/td><td>Correct invoices, controlled exposure and traceable payments<\/td><\/tr><tr><td>Customer Service<\/td><td>Status communication and coordination of customer exceptions<\/td><td>Consistent information and escalation routes<\/td><\/tr><tr><td>IT<\/td><td>Access, feasibility, integration and support assessment<\/td><td>Maintainable solutions<\/td><\/tr><tr><td>Learner as portfolio analyst<\/td><td>Produce, review and explain analysis and validation designs<\/td><td>Credible evidence of understanding<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Detailed billing ownership and handoff rules remain unresolved. No sponsor approval is claimed.<\/p>\n<h2>Reference model and choices<\/h2>\n<p>Provisionally select SAP S/4HANA Cloud Public Edition to keep standard-process research within a defined product boundary. An edition identifies a product offering/operating model; a release identifies its version. The reference release is unresolved. If learner access uses another edition, assess whether to change the reference before making capability claims.<\/p>\n<p>This selection is a learning decision, not an investment recommendation. No edition-specific capability has yet been verified or demonstrated. Record official SAP source URLs and actual access dates before using claims in the future-state design. Do not substitute another edition&#x27;s documentation without flagging the difference.<\/p>\n<p>Alternatives to assess later include improving manual controls, standardising the process, and an SAP-aligned future state. Prefer standard processes when they meet needs; justify any extension and its maintenance cost.<\/p>\n<h2>Constraints, dependencies and unresolved choices<\/h2>\n<p>The user requires a free working route. No paid SAP environment, Office licence, course, domain or hosting is required. Use documentation and synthetic analysis, with free editing and analysis tools. See free-working-route.md for cost boundaries and evidence limitations.<\/p>\n<p>See the linked register <small>(../registers/assumptions.md)<\/small>. SAP access, study time and primary target role are pending. Baselines, business targets, current tools, partial-delivery policy, delivery promises, billing ownership and payment exception rules remain provisional or unresolved.<\/p>\n<h2>Portfolio completion criteria<\/h2>\n<p>- All three problems trace to relevant requirements, process changes and validation evidence.<\/p>\n<p>- Normal flow and all seven exceptions are covered consistently across maps, stories and tests.<\/p>\n<p>- SAP claims have official sources and access dates or explicit uncertainty; documentation and demonstrations are distinguished.<\/p>\n<p>- Synthetic data relationships and KPI calculations are reproducible and checked.<\/p>\n<p>- SAP test cases remain Not executed unless run; walkthrough issues are design issues, not executed SAP defects.<\/p>\n<p>- Benefits and financial scenarios are labelled; capacity released is distinguished from cash savings.<\/p>\n<p>- Resume claims match actual completed work; learner can explain key decisions and AI use.<\/p>\n<p>These are portfolio criteria, separate from unachieved fictional business targets. Production readiness would require real discovery, configuration, integration, security assessment, system testing, business acceptance and operational preparation beyond this scope.<\/p>\n<p>Deliverables and phase checkpoints appear in the delivery plan <small>(delivery-plan.md)<\/small>.<\/p>"}, {"path": "phase-01/delivery-plan.md", "html": "<h1>Learning and delivery plan<\/h1>\n<blockquote>Supersession note — 11 October 2026: the user authorized building all phases. This Phase 1 draft is retained as the starting charter. Current status and decisions are in ../registers/progress.md and ../registers/decisions.md. Public Edition 2602 is now the research reference. Initial “not started” and evidence-pending statements below describe 8 October, not the current artifact set.<\/blockquote>\n<p>Provisional: 12 weeks at 4–6 hours per week, approximately 48–72 hours. This is a learning estimate, not an implementation commitment. Actual dates and pace await the learner&#x27;s answer. Do not advance phases before reviewing learner answers unless the learner asks to continue.<\/p>\n<div class=\"scroll\"><table><thead><tr><th>Week<\/th><th>Phase and planned deliverable<\/th><th>Completion checkpoint<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>1: Charter and plan<\/td><td>Scope, evidence boundaries and approach understood<\/td><\/tr><tr><td>2<\/td><td>2: Stakeholders and simulated discovery<\/td><td>Sources labelled; disagreements recorded<\/td><\/tr><tr><td>3<\/td><td>3: Current-state flow and causes<\/td><td>Owners, handoffs, exceptions and evidence gaps visible<\/td><\/tr><tr><td>4<\/td><td>4: BRD, requirements and traceability<\/td><td>Requirements justified and testable<\/td><\/tr><tr><td>5<\/td><td>5: SAP research and future-state design<\/td><td>Choices supported or explicitly uncertain<\/td><\/tr><tr><td>6<\/td><td>6: Desk-based fit-to-standard assessment<\/td><td>Gaps, alternatives and validation needs recorded<\/td><\/tr><tr><td>7<\/td><td>7: Focused backlog<\/td><td>12–15 substantive stories with linked acceptance criteria<\/td><\/tr><tr><td>8–9<\/td><td>8: Synthetic data and KPI analysis<\/td><td>Approximately 200–500 orders; reproducible checks and calculations<\/td><\/tr><tr><td>10<\/td><td>9: UAT design and available validation<\/td><td>Around 20 meaningful cases; honest execution status<\/td><\/tr><tr><td>11<\/td><td>10: Risks, change and business case<\/td><td>Approximately 10 substantive risks; transparent option/benefit assumptions<\/td><\/tr><tr><td>12<\/td><td>11–12: Packaging, interviews and final review<\/td><td>8–10 slide presentation; claims supported; learner explains decisions<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Each week: roughly one hour of concepts, two to three hours of deliverable work and one hour of review/explanation practice. Extend the plan if research or learner review needs more time; do not cut evidence checks to meet the estimate.<\/p>\n<h2>Phase 1 practical task<\/h2>\n<p>Using NS-ORD-1001, write three sentences: identify one possible order-processing error, suggest a control, and name evidence that would show whether the control worked. Use quality-review experience without disclosing confidential employer information.<\/p>\n<p>The three setup questions have already been asked: SAP practice access, available study hours and preferred target role. Answers are pending. After tailoring the charter, ask three understanding-check questions and review the learner&#x27;s answers before Phase 2. Do not mistake the instruction to use the cloud workspace for an answer about SAP access.<\/p>"}, {"path": "phase-01/free-working-route.md", "html": "<h1>Selected route — no required paid software<\/h1>\n<blockquote>Supersession note — 11 October 2026: the user authorized building all phases. This Phase 1 draft is retained as the starting charter. Current status and decisions are in ../registers/progress.md and ../registers/decisions.md. Public Edition 2602 is now the research reference. Initial “not started” and evidence-pending statements below describe 8 October, not the current artifact set.<\/blockquote>\n<p>Decision: use documentation, synthetic data and reproducible analysis. SAP practice access is still unknown and is not required to complete the portfolio. Do not buy a subscription or start a payment-card trial for this project.<\/p>\n<p>This route best fits a beginner building evidence of business analysis: the work can demonstrate clear requirements, process reasoning, controls, data analysis and test design without implying hands-on SAP implementation. Public Edition remains a provisional research reference, not a free SAP system or purchase recommendation.<\/p>\n<h2>Tools and formats<\/h2>\n<p>- Read the complete Phase 1 pack in the standalone HTML file using a browser. It has no external fonts, scripts, accounts or network requests. Use the browser&#x27;s Print / Save as PDF option if available.<\/p>\n<p>- Edit Markdown sources using a plain-text editor. They are the authoritative versions used to generate the pack.<\/p>\n<p>- Open DOCX and XLSX copies in the free LibreOffice Writer and Calc applications. Microsoft Office is not required. Layout may vary between applications; LibreOffice rendering has not been tested here.<\/p>\n<p>- CSV copies of each workbook sheet provide simple, portable access. CSV does not retain workbook formatting.<\/p>\n<p>- Later data work will use CSV, free Python tools and optionally SQLite. A spreadsheet-based dashboard can use LibreOffice Calc. Power BI and paid sharing services are not required.<\/p>\n<p>- Use publicly accessible official SAP documentation and free SAP Learning material where available. Check access and edition before relying on a source. If a resource requires payment, find another official public source or label the claim unverified. Do not assume practice systems, certifications or all SAP training are free.<\/p>\n<p>- Keep artifacts in the workspace and download local copies. GitHub publishing remains optional and requires a later user request; no paid hosting or domain is needed.<\/p>\n<h2>Cost boundary<\/h2>\n<p>Required incremental software purchases for this planned route: £0. This is a project tooling decision, not a business-case saving. Existing device, internet and this chat/cloud service are outside that estimate; their pricing and availability are not controlled by this project. No guarantee of free ongoing cloud hosting is made. Downloaded source files can be used independently of this workspace.<\/p>\n<h2>Alternatives and limitations<\/h2>\n<p>A paid SAP practice environment could add demonstrated system evidence but is not needed for the chosen route. A documentation-based portfolio cannot claim system configuration, integration execution or SAP UAT execution. All unrun SAP cases will remain Not executed. Data checks and walkthroughs will be labelled separately.<\/p>\n<p>The full twelve-phase project is still planned, but only Phase 1 is built. Learning reviews remain part of the approach; requesting a free version does not supply answers or prove understanding.<\/p>"}, {"path": "phase-01/learning-review.md", "html": "<h1>Phase 1 — Learning review<\/h1>\n<blockquote>Supersession note — 11 October 2026: the user authorized building all phases. This Phase 1 draft is retained as the starting charter. Current status and decisions are in ../registers/progress.md and ../registers/decisions.md. Public Edition 2602 is now the research reference. Initial “not started” and evidence-pending statements below describe 8 October, not the current artifact set.<\/blockquote>\n<p>Status: not yet answered or assessed. This is a learning exercise, not a stakeholder interview or an executed SAP test.<\/p>\n<h2>Purpose<\/h2>\n<p>A charter agrees what problem the project investigates, what work belongs in scope and what evidence will count as completion. It prevents a proposed software solution from replacing a clear business need.<\/p>\n<p>Your quality-audit experience is relevant: an error observation identifies a problem; a control addresses risk; evidence shows whether the control operated. A proposed cause still requires investigation.<\/p>\n<h2>Worked example<\/h2>\n<p>NS-ORD-1001 requests 100 brackets. Only 60 are physically on hand, and their availability for this customer is unresolved. A possible error is promising all 100 for 9 October without checking commitments and restrictions. A proposed control is to validate available quantity and a defensible delivery date before confirming the promise. Evidence would include the availability information used, the recorded promise and who confirmed it. These are proposed controls and required evidence, not verified SAP functions or actual records.<\/p>\n<p>An alternative is offering a partial delivery with customer agreement. That may meet an urgent customer need but add handling and transport effort. We have not decided whether it is the correct policy.<\/p>\n<h2>Practical task<\/h2>\n<p>Write three sentences proposing a different possible error, a suitable control and evidence you would inspect. You may use missing customer information or a delayed billing handoff. Avoid confidential employer details.<\/p>\n<h2>Three understanding-check questions<\/h2>\n<p>1. For NS-ORD-1001, why can we not promise 100 units merely because 60 units are physically in the warehouse? Name two facts you would check before confirming a delivery date.<\/p>\n<p>2. Goods leave the warehouse on Monday, the goods-issue posting is recorded on Tuesday, and the customer receives them on Wednesday. Which event would you use to assess a promise of customer receipt, and why must the other dates remain separate?<\/p>\n<p>3. Explain the difference between completing this portfolio and achieving a business improvement. Give one piece of evidence for each and identify which we currently have.<\/p>\n<p>Review criteria: distinguish physical stock from available stock; distinguish dispatch, posting and receipt; distinguish portfolio artifacts from business outcomes. Learner responses and feedback remain pending. No pass or competence claim is recorded.<\/p>"}, {"path": "phase-01/representative-order.md", "html": "<h1>Representative order — NS-ORD-1001<\/h1>\n<blockquote>Supersession note — 11 October 2026: the user authorized building all phases. This Phase 1 draft is retained as the starting charter. Current status and decisions are in ../registers/progress.md and ../registers/decisions.md. Public Edition 2602 is now the research reference. Initial “not started” and evidence-pending statements below describe 8 October, not the current artifact set.<\/blockquote>\n<p>All values below are fictional learning assumptions. This is a scenario record, not an SAP transaction or executed test.<\/p>\n<div class=\"scroll\"><table><thead><tr><th>Field<\/th><th>Value<\/th><\/tr><\/thead><tbody><tr><td>Order reference<\/td><td>NS-ORD-1001; portfolio identifier, not SAP-generated<\/td><\/tr><tr><td>Customer<\/td><td>CUST-001 — Alder Engineering Ltd<\/td><\/tr><tr><td>Product<\/td><td>PROD-001 — standard mounting bracket<\/td><\/tr><tr><td>Warehouse<\/td><td>WH-01<\/td><\/tr><tr><td>Order received<\/td><td>5 October 2026<\/td><\/tr><tr><td>Quantity ordered<\/td><td>100 units<\/td><\/tr><tr><td>Unit selling price<\/td><td>£25 excluding VAT<\/td><\/tr><tr><td>Net order value<\/td><td>100 × £25 = £2,500<\/td><\/tr><tr><td>Customer-requested receipt date<\/td><td>9 October 2026; not a confirmed promise<\/td><\/tr><tr><td>Initial stock<\/td><td>60 units physically on hand; usable and uncommitted quantity unresolved<\/td><\/tr><tr><td>Payment terms<\/td><td>Illustrative: 30 days from invoice date<\/td><\/tr><tr><td>Open decision<\/td><td>Partial-delivery permission and defensible delivery promise<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Do not infer that the 60 units are available for this customer. Reservations, quality restrictions or inaccurate records could affect availability; these possibilities are unverified.<\/p>\n<p>The net value is not profit, cash received or a tax-inclusive invoice total. No acceptance, dispatch, posting, invoice or payment has occurred in a demonstrated system. Keep later exception variants separate from this base scenario.<\/p>"}, {"path": "phase-02/discovery.md", "html": "<h1>Stakeholders and simulated discovery<\/h1>\n<p>Independent simulated portfolio · 2026-10-11 · AI-assisted draft; learner review pending.<\/p>\n<h2>Purpose and boundary<\/h2>\n<p>Find the business need behind each complaint and identify whose policy decisions conflict. All dialogue below is invented role-play, created to practise discovery. There were no stakeholder interviews, workshops, attendance records or approvals.<\/p>\n<div class=\"scroll\"><table><thead><tr><th>Role<\/th><th>Responsibility<\/th><th>Interest<\/th><th>Influence<\/th><th>Concern<\/th><th>Engagement<\/th><\/tr><\/thead><tbody><tr><td>Sales<\/td><td>Order capture, validation, commercial promise<\/td><td>Fast acceptance and customer retention<\/td><td>High: controls promises<\/td><td>Checks may slow response<\/td><td>Review incomplete/short-stock examples and promise rules<\/td><\/tr><tr><td>Warehouse<\/td><td>Stock accuracy, picking, dispatch and posting evidence<\/td><td>Feasible priorities and correct quantities<\/td><td>High: controls fulfilment<\/td><td>Sales promises exceed usable stock<\/td><td>Walk shortages, split deliveries and event recording<\/td><\/tr><tr><td>Finance<\/td><td>Credit, billing, receivables and controls<\/td><td>Accurate charges and supported clearing<\/td><td>High: financial control owner<\/td><td>Pressure to bypass blocks; late handoffs<\/td><td>Review authorization, billing and payment scenarios<\/td><\/tr><tr><td>Customer Service<\/td><td>Status communication and exception coordination<\/td><td>Reliable answers and named owner<\/td><td>Medium: customer voice<\/td><td>Conflicting statuses and partial shipments<\/td><td>Walk customer enquiry and delivery-agreement cases<\/td><\/tr><tr><td>IT<\/td><td>Feasibility, roles, integration and reporting support<\/td><td>Standard, maintainable design<\/td><td>High: technical feasibility<\/td><td>Custom dashboard scope and unverified integrations<\/td><td>Evidence-led fit review and data contract checks<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Interview guide to use in a real discovery<\/h2>\n<p>Sales: Walk through the last incomplete order. Which fields were missing, where were they captured and what proved correction? What evidence supports your delivery promise? How do you recognize a duplicate customer purchase order? When can cancellation safely stop fulfilment?<\/p>\n<p>Warehouse: Show how usable stock differs from shelf quantity. What happens when picking finds fewer units? How do you authorize split shipments? Who records dispatch, goods issue and receipt evidence, and how are timing differences reconciled?<\/p>\n<p>Finance: What triggers a credit block and who may release it? What proves a delivery is billable? How do you identify missed or duplicate charges? What distinguishes invoice creation, accounting posting and successful customer output? How do you handle short or unidentified receipts?<\/p>\n<p>Customer Service: What information is needed to answer an order enquiry? Which status is authoritative? How is consent to split shipment recorded? How do you escalate an overdue response and notify the customer without promising an unsupported date?<\/p>\n<p>For every answer ask for an example, record, frequency and contrary case. Do not turn an opinion into a quantified baseline.<\/p>\n<h2>Role-play workshop — proposed 60-minute agenda<\/h2>\n<p>10 minutes: agree boundaries and terminology. 20: walk NS-ORD-1001. 15: debate policy conflicts. 10: agree provisional requirements. 5: list evidence gaps. This agenda has not been run with people.<\/p>\n<p>Sales: “Can we promise all 100 for Friday so the customer stays with us?” Warehouse: “Only 60 are on hand; we have not checked commitments.” Customer Service: “I could ask whether 60 helps, but I need a defensible date for the rest.” Finance: “Agreement to split does not remove a credit hold.” IT: “First confirm the rules; do not commission a custom promise engine.”<\/p>\n<p>Later, Warehouse says billing belongs to Finance once goods leave. Finance says a dispatch email is still needed. The analyst proposes that Warehouse owns accurate dispatch/posting evidence and Finance owns a daily billable/unbilled review. Neither team can treat the handoff as complete solely because an email was sent. This is a proposed resolution, not approval.<\/p>\n<h2>Conflicts and proposed resolutions<\/h2>\n<div class=\"scroll\"><table><thead><tr><th>Conflict<\/th><th>Proposed resolution<\/th><th>Alternative and trade-off<\/th><th>Decision owner<\/th><\/tr><\/thead><tbody><tr><td>Fast promise vs feasible supply<\/td><td>Confirm only supported quantity/date; explain shortfall<\/td><td>Provisional estimate can be communicated if clearly unconfirmed<\/td><td>Sales with Warehouse<\/td><\/tr><tr><td>Urgent partial vs single complete shipment<\/td><td>Explicit agreement and cost awareness; retain remainder<\/td><td>Wait for all stock: lower handling effort, potentially worse service<\/td><td>Customer Service with Sales<\/td><\/tr><tr><td>Sales urgency vs credit control<\/td><td>Finance decides credit release; Sales requests review<\/td><td>Blanket override is rejected because it removes control<\/td><td>Finance<\/td><\/tr><tr><td>Billing ownership ambiguity<\/td><td>Warehouse owns fulfilment evidence; Finance owns billing queue and reconciliation<\/td><td>Email checklist is a low-cost interim control<\/td><td>Finance<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Findings<\/h2>\n<p>See discovery-findings.csv for the 11 linked simulated sources. None establish actual frequency or impact. Validate proposed policies with real role owners before implementation.<\/p>"}, {"path": "phase-02/learning-review.md", "html": "<h1>Phase 2 learning review — Stakeholders and discovery<\/h1>\n<p>Independent simulated portfolio · 2026-10-11 · AI-assisted draft; learner review pending.<\/p>\n<h2>Purpose and essential concept<\/h2>\n<p>Discovery finds the needs behind requested features. Your audit feedback experience helps you ask for examples rather than accept a general complaint.<\/p>\n<h2>Practical task<\/h2>\n<p>Rewrite one delivery-promise interview question so it asks for observable evidence.<\/p>\n<h2>Three understanding questions<\/h2>\n<p>1. Why might Sales and Warehouse disagree about dates?<\/p>\n<p>2. Who should own a credit-release decision?<\/p>\n<p>3. Why is our role-play not interview evidence?<\/p>\n<p>Status: answers not supplied; understanding not assessed. Review before claiming mastery. Building all phases was authorized; this does not substitute for your learning review.<\/p>"}, {"path": "phase-02/responsibilities.md", "html": "<h1>Proposed responsibility matrix<\/h1>\n<p>Independent simulated portfolio · 2026-10-11 · AI-assisted draft; learner review pending.<\/p>\n<p>A = accountable for the outcome; R = performs work; C = consulted; I = informed. One accountable role per activity. A/R combines responsibility for this small-company simulation, not every named employee. Credit request and release must remain separated.<\/p>\n<div class=\"scroll\"><table><thead><tr><th>Activity<\/th><th>Sales<\/th><th>Warehouse<\/th><th>Finance<\/th><th>Customer Service<\/th><th>IT<\/th><\/tr><\/thead><tbody><tr><td>Customer/order validation<\/td><td>A/R<\/td><td>I<\/td><td>C<\/td><td>C<\/td><td>I<\/td><\/tr><tr><td>Promise and partial agreement<\/td><td>A/R<\/td><td>C<\/td><td>I<\/td><td>C<\/td><td>I<\/td><\/tr><tr><td>Credit release<\/td><td>C<\/td><td>I<\/td><td>A/R<\/td><td>I<\/td><td>I<\/td><\/tr><tr><td>Dispatch and goods issue<\/td><td>C<\/td><td>A/R<\/td><td>C<\/td><td>I<\/td><td>I<\/td><\/tr><tr><td>Billing and corrections<\/td><td>I<\/td><td>C<\/td><td>A/R<\/td><td>C<\/td><td>I<\/td><\/tr><tr><td>Payment allocation<\/td><td>I<\/td><td>I<\/td><td>A/R<\/td><td>C<\/td><td>I<\/td><\/tr><tr><td>Customer exception communication<\/td><td>C<\/td><td>C<\/td><td>C<\/td><td>A/R<\/td><td>I<\/td><\/tr><tr><td>Role/report configuration<\/td><td>C<\/td><td>C<\/td><td>C<\/td><td>C<\/td><td>A/R<\/td><\/tr><\/tbody><\/table><\/div>"}, {"path": "phase-03/current-state.md", "html": "<h1>AS-IS process and root-cause hypotheses<\/h1>\n<p>Independent simulated portfolio 15.1 714.2,-110.79\"/>\n<text text-anchor=\"middle\" x=\"732\" y=\"-124\" font-family=\"DejaVu Sans\" font-size=\"10.00\">No<\/text>\n<\/g>\n<!-- V -->\n<g id=\"node22\" class=\"node\">\n<title>V<\/title>\n<path fill=\"#eaf3f7\" stroke=\"#397187\" d=\"M1114,-105C1114,-105 862,-105 862,-105 856,-105 850,-99 850,-93 850,-93 850,-81 850,-81 850,-75 856,-69 862,-69 862,-69 1114,-69 1114,-69 1120,-69 1126,-75 1126,-81 1126,-81 1126,-93 1126,-93 1126,-99 1120,-105 1114,-105\"/>\n<text text-anchor=\"middle\" x=\"988\" y=\"-84.2\" font-family=\"DejaVu Sans\" font-size=\"11.00\">Finance / Warehouse: return or reversal review<\/text>\n<\/g>\n<!-- T&#45;&gt;V -->\n<g id=\"edge27\" class=\"edge\">\n<title>T&#45;&gt;V<\/title>\n<path fill=\"none\" stroke=\"#607887\" d=\"M786.57,-153.72C823.19,-141.77 881.75,-122.67 926.32,-108.13\"/>\n<polygon fill=\"#607887\" stroke=\"#607887\" points=\"927.47,-111.43 935.89,-105 925.29,-104.78 927.47,-111.43\"/>\n<text text-anchor=\"middle\" x=\"892\" y=\"-124\" font-family=\"DejaVu Sans\" font-size=\"10.00\">Yes<\/text>\n<\/g>\n<!-- U&#45;&gt;S -->\n<g id=\"edge28\" class=\"edge\">\n<title>U&#45;&gt;S<\/title>\n<path fill=\"none\" stroke=\"#607887\" d=\"M660.39,-68.92C644.65,-60.41 625.43,-50.03 608.61,-40.94\"/>\n<polygon fill=\"#607887\" stroke=\"#607887\" points=\"610.02,-37.72 599.55,-36.05 606.69,-43.88 610.02,-37.72\"/>\n<\/g>\n<!-- V&#45;&gt;S -->\n<g id=\"edge29\" class=\"edge\">\n<title>V&#45;&gt;S<\/title>\n<path fill=\"none\" stroke=\"#607887\" d=\"M881.2,-68.96C821.23,-59.4 746.31,-47.45 684.79,-37.63\"/>\n<polygon fill=\"#607887\" stroke=\"#607887\" points=\"685.07,-34.13 674.64,-36.01 683.97,-41.04 685.07,-34.13\"/>\n<\/g>\n<\/g>\n<\/svg>\n<\/div>\n<p>The full eight-step register is in as-is-step-register.csv. Cancellation after dispatch is an exception routed to controlled review, not a full returns redesign. Unmatched and partial payments remain visible rather than pretending the order is financially complete.<\/p>\n<h2>Five Whys — late billing hypothesis<\/h2>\n<p>1. Why is billing late? A dispatched delivery is absent from the billing review list.<\/p>\n<p>2. Why absent? Finance has not received or located the handoff email.<\/p>\n<p>3. Why does that matter? The email is treated as the trigger instead of reconciling all eligible deliveries.<\/p>\n<p>4. Why is reconciliation absent? Ownership of the complete billable population is unclear.<\/p>\n<p>5. Why unclear? The cross-team procedure defines individual tasks but no accountable handoff outcome.<\/p>\n<p>This chain is a hypothesis, not a root cause proven by five repetitions. Alternative explanations include pricing incompleteness, goods-issue timing, invoice schedules or accounting blocks. Compare dispatch, posting, invoice and output dates plus exception reasons before attributing delay. A missing receipt timestamp can be an evidence gap rather than a late physical delivery.<\/p>\n<h2>Root-cause test plan<\/h2>\n<div class=\"scroll\"><table><thead><tr><th>Hypothesis<\/th><th>Evidence that supports it<\/th><th>Evidence that could refute it<\/th><th>Proposed response<\/th><\/tr><\/thead><tbody><tr><td>Fragmented status causes enquiries<\/td><td>Enquiry timestamps coincide with inconsistent team records<\/td><td>Accurate shared records exist but users cannot locate them<\/td><td>Shared definitions or usability training depending on evidence<\/td><\/tr><tr><td>Promise ignores commitments<\/td><td>Orders promised beyond usable stock at confirmation<\/td><td>Stock was sufficient but damaged during picking<\/td><td>Availability review or warehouse control depending on cause<\/td><\/tr><tr><td>Email handoff delays billing<\/td><td>Eligible items wait until email arrives<\/td><td>Items were blocked for pricing despite timely email<\/td><td>Queue ownership or pricing correction depending on cause<\/td><\/tr><\/tbody><\/table><\/div>"}, {"path": "phase-03/learning-review.md", "html": "<h1>Phase 3 learning review — Current-state process<\/h1>\n<p>Independent simulated portfolio · 2026-10-11 · AI-assisted draft; learner review pending.<\/p>\n<h2>Purpose and essential concept<\/h2>\n<p>A process map shows where work and information cross roles. A late invoice is a symptom; unclear handoff ownership is a hypothesis.<\/p>\n<h2>Practical task<\/h2>\n<p>Use Five Whys to challenge one billing-delay explanation.<\/p>\n<h2>Three understanding questions<\/h2>\n<p>1. What evidence could disprove our handoff hypothesis?<\/p>\n<p>2. Where does a physical event differ from a posting?<\/p>\n<p>3. Why call this a flowchart rather than BPMN?<\/p>\n<p>Status: answers not supplied; understanding not assessed. Review before claiming mastery. Building all phases was authorized; this does not substitute for your learning review.<\/p>"}, {"path": "phase-04/brd.md", "html": "<h1>Concise business requirements document<\/h1>\n<p>Independent simulated portfolio · 2026-10-11 · AI-assisted draft; learner review pending.<\/p>\n<h2>Business need<\/h2>\n<p>PROB-001: unclear order status. PROB-002: stock-related delays. PROB-003: billing handoff delays. The goal is controlled, visible processing, not buying SAP by default. Scope, exclusions and NS-ORD-1001 remain as in Phase 1. The source-labelled discovery is simulated; no real stakeholder acceptance exists.<\/p>\n<h2>Business requirements<\/h2>\n<div class=\"scroll\"><table><thead><tr><th>ID<\/th><th>Type<\/th><th>Statement<\/th><th>Rationale<\/th><th>Source<\/th><th>Priority<\/th><th>Priority_reason<\/th><th>Acceptance<\/th><th>Dependencies<\/th><th>Validation<\/th><\/tr><\/thead><tbody><tr><td>BR-001<\/td><td>Business<\/td><td>Enable accountable, traceable order and payment status from intake through allocation and reporting.<\/td><td>Reduce uncertainty and prevent lost exceptions.<\/td><td>PROB-001; SIM-CS-01; SIM-FIN-04<\/td><td>Must<\/td><td>Core visibility problem<\/td><td>Representative normal, blocked, cancelled and partially paid cases expose current stage, owner, remaining quantity/balance and evidence gaps.<\/td><td>Master data; linked documents; agreed role access<\/td><td>Trace review and planned UAT TC-001;TC-014;TC-017<\/td><\/tr><tr><td>BR-002<\/td><td>Business<\/td><td>Base fulfilment commitments and release on feasible supply, customer agreement and financial controls.<\/td><td>Avoid unsupported promises and unauthorized shipments.<\/td><td>PROB-002; SIM-WH-01; SIM-FIN-01<\/td><td>Must<\/td><td>Core fulfilment/control problem<\/td><td>Stock shortage, partial permission and block cases follow rules; measures KPI-001/002/003 use the agreed definitions; no achieved improvement claimed.<\/td><td>Stock accuracy; credit policy; transit assumptions<\/td><td>Planned UAT TC-004 through TC-008; synthetic KPI checks<\/td><\/tr><tr><td>BR-003<\/td><td>Business<\/td><td>Make eligible fulfilled deliveries visible to Finance for timely, accurate and traceable billing.<\/td><td>Remove avoidable handoff waiting without billing incorrectly.<\/td><td>PROB-003; SIM-FIN-02; SIM-FIN-03<\/td><td>Must<\/td><td>Core billing problem<\/td><td>Eligible delivery appears in review population without an email; correction/duplicate/error paths retain links and owner; KPI-004 includes unbilled context.<\/td><td>Posting accuracy; billing relevance; Finance ownership<\/td><td>Planned UAT TC-012;TC-013;TC-022<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Functional and non-functional scope<\/h2>\n<p>requirements.csv contains 3 business, 15 functional and 5 non-functional requirements with rationale, priority, acceptance, dependencies and validation. business-rules.csv defines 12 stable rules. traceability.csv connects every FR to problem → BR → process change → story → tests → KPI/control. nonfunctional-trace.csv adds NFR coverage. Access permissions are proposed in access-matrix.csv; the offline viewer has no production authorization enforcement.<\/p>\n<p>Must = essential to a core flow/control; Should = useful with a controlled interim process. These priorities do not imply a committed sprint. Thresholds follow business need: exact key/balance reconciliation, zero unauthorized releases in a test set, daily management review freshness, and formative usability by role. No arbitrary speed or improvement target is treated as agreed.<\/p>\n<h2>Requirement review decisions<\/h2>\n<p>“Real-time visibility” was narrowed to named status fields and a stated refresh time; real-time integration lacks evidence of need. “Automatic billing” was narrowed to complete billable-population review and controlled invoice creation, including failures. “All stock is available” was rejected because commitments and restrictions matter. “Clear every payment automatically” was rejected because unidentified cash needs investigation.<\/p>\n<h2>Unresolved items and change control<\/h2>\n<p>Retention period, exact SAP role restrictions, carrier receipt capture, correction method, duplicate customer PO policy and refresh architecture need validation. A duplicate customer-PO control is a discovery question, not silently added to the approved scope. Proposed changes must record source, rationale and impacts on process, rules, stories, tests and KPI definitions. No actual approval has been recorded.<\/p>"}, {"path": "phase-04/learning-review.md", "html": "<h1>Phase 4 learning review — Requirements<\/h1>\n<p>Independent simulated portfolio · 2026-10-11 · AI-assisted draft; learner review pending.<\/p>\n<h2>Purpose and essential concept<\/h2>\n<p>A requirement states an observable need, not a vague wish. Audit criteria are a useful analogy for acceptance criteria.<\/p>\n<h2>Practical task<\/h2>\n<p>Rewrite “make orders visible” with fields, role and an observable result.<\/p>\n<h2>Three understanding questions<\/h2>\n<p>1. How does a rule differ from a requirement?<\/p>\n<p>2. What makes an acceptance criterion testable?<\/p>\n<p>3. Why keep a source for each requirement?<\/p>\n<p>Status: answers not supplied; understanding not assessed. Review before claiming mastery. Building all phases was authorized; this does not substitute for your learning review.<\/p>"}, {"path": "phase-05/future-state.md", "html": "<h1>SAP reference and proposed TO-BE<\/h1>\n<p>Independent simulated portfolio · 2026-10-11 · AI-assisted draft; learner review pending.<\/p>\n<h2>Reference boundary<\/h2>\n<p>Select SAP S/4HANA Cloud Public Edition <strong>2602<\/strong>, using the official release-specific feature scope document version 5.0 dated 11 June 2026. This is a stable research reference, not a claim to use the newest release or a live tenant. Public Edition suits a standard-first learning exercise; it is not free SAP hosting. Learning pages support concepts but are not pinned to 2602. Feature entitlement, country scope, activation and exact configuration require validation.<\/p>\n<h2>Essential concepts<\/h2>\n<p>A business partner is the common customer identity with role-specific information (SAP-005). A sales order records the requested commercial transaction. Availability and scheduling help establish a feasible quantity/date; shelf stock alone is insufficient (SAP-002). An outbound delivery organizes shipping; partial-delivery rules need agreement (SAP-003). Goods issue records the outbound stock event, while physical dispatch and receipt are separately evidenced. Billing charges the customer and connects to receivables, the amount owed (SAP-001). Finance then handles payment matching and differences (SAP-006). No step has been demonstrated in an SAP system.<\/p>\n<h2>Proposed process flowchart — not BPMN<\/h2>\n<div class=\"diagram\"><svg width=\"1419pt\" height=\"1508pt\"\n viewBox=\"0.00 0.00 1418.50 1508.00\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n<g id=\"graph0\" class=\"graph\" transform=\"scale(1 1) rotate(0) translate(18 1490)\">\n<title>process<\/title>\n<polygon fill=\"white\" stroke=\"transparent\" points=\"-18,18 -18,-1490 1400.5,-1490 1400.5,18 -18,18\"/>\n<!-- A -->\n<g id=\"node1\
