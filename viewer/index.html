al review<\/text>\n<\/g>\n<!-- AC&#45;&gt;AE -->\n<g id=\"edge39\" class=\"edge\">\n<title>AC&#45;&gt;AE<\/title>\n<path fill=\"none\" stroke=\"#607887\" d=\"M1172.02,-155.09C1119.9,-143.08 1030.86,-122.55 964.96,-107.36\"/>\n<polygon fill=\"#607887\" stroke=\"#607887\" points=\"965.53,-103.9 955,-105.06 963.96,-110.72 965.53,-103.9\"/>\n<text text-anchor=\"middle\" x=\"1075\" y=\"-124\" font-family=\"DejaVu Sans\" font-size=\"10.00\">Yes<\/text>\n<\/g>\n<!-- AD&#45;&gt;AB -->\n<g id=\"edge40\" class=\"edge\">\n<title>AD&#45;&gt;AB<\/title>\n<path fill=\"none\" stroke=\"#607887\" d=\"M1086.7,-68.96C1009.22,-59.28 912.19,-47.15 833.14,-37.27\"/>\n<polygon fill=\"#607887\" stroke=\"#607887\" points=\"833.46,-33.78 823.1,-36.01 832.59,-40.73 833.46,-33.78\"/>\n<\/g>\n<!-- AE&#45;&gt;AB -->\n<g id=\"edge41\" class=\"edge\">\n<title>AE&#45;&gt;AB<\/title>\n<path fill=\"none\" stroke=\"#607887\" d=\"M831.54,-68.92C805.43,-59.9 773.22,-48.78 745.83,-39.32\"/>\n<polygon fill=\"#607887\" stroke=\"#607887\" points=\"746.96,-36.01 736.37,-36.05 744.68,-42.62 746.96,-36.01\"/>\n<\/g>\n<\/g>\n<\/svg>\n<\/div>\n<h2>Ownership, controls and handoffs<\/h2>\n<p>Sales owns valid order/promise information; Customer Service records agreement and communication; Warehouse owns quantities and dispatch/posting evidence; Finance owns credit, billable-population reconciliation, corrections and allocation; IT supports roles, interfaces and reporting. A handoff is complete when the receiving role has a linked, actionable record or a named exception—not simply an email. RULE-001 through RULE-012 apply. PC-001 through PC-015 identify changes in traceability.csv.<\/p>\n<p>The base NS-ORD-1001 remains unresolved: 100 ordered at £25, 60 physically on hand, requested receipt 9 October. A <strong>separate design variant<\/strong> assumes 60 are usable and the customer agrees: deliver/bill 60 (£1,500 net), keep 40 open; a £900 partial payment leaves £600 analytical exposure on that invoice. This is an illustration, not an executed order or the baseline record&#x27;s actual history.<\/p>\n<h2>Current vs proposed<\/h2>\n<div class=\"scroll\"><table><thead><tr><th>Current assumption<\/th><th>Proposed change<\/th><th>Why / alternative<\/th><\/tr><\/thead><tbody><tr><td>Fragmented status lists<\/td><td>Linked order view with reason and owner<\/td><td>Standard views first; controlled shared register if fit unresolved<\/td><\/tr><tr><td>Shelf-stock promise<\/td><td>Availability/scheduling review and retained original promise<\/td><td>Manual checked promise can be an interim control<\/td><\/tr><tr><td>Informal split approval<\/td><td>Explicit permission, quantity and remainder<\/td><td>Complete delivery when customer does not agree<\/td><\/tr><tr><td>Dispatch-email billing trigger<\/td><td>Finance queue and daily reconciliation<\/td><td>Daily manual checklist is a credible low-cost option<\/td><\/tr><tr><td>Ad hoc payment matching<\/td><td>Supported allocation and visible unmatched queue<\/td><td>Keep on-account investigation; no forced write-off<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Data needs beyond the analytical dataset<\/h2>\n<p>Customer identity/status and ship-to; product/UOM; quantity and price conditions; requested/initial confirmed dates; check time and block reasons; delivery references and authorized/actual quantities; dispatch/PGI/receipt timestamps; invoice/accounting/output status; corrections; receipt/allocation amounts; actor and change reason. The synthetic dataset is a deliberately smaller analytical model, not an SAP extraction schema or migration mapping.<\/p>\n<p>Receipt capture may need a manual evidence field or carrier integration; this exact fit is unresolved. Returns/reversals, tax settings, replenishment, bank formats and retention policy are dependencies. Do not propose an extension until standard capture and export are tested. Official URLs and actual access date appear in sap-evidence.csv; two inaccessible Help pages are explicitly unverified.<\/p>"}, {"path": "phase-05/learning-review.md", "html": "<h1>Phase 5 learning review — SAP reference and future state<\/h1>\n<p>Independent simulated portfolio · 2026-10-11 · AI-assisted draft; learner review pending.<\/p>\n<h2>Purpose and essential concept<\/h2>\n<p>Standard capabilities inform design; they do not prove your policy is configured.<\/p>\n<h2>Practical task<\/h2>\n<p>Explain NS-ORD-1001 using order, delivery, goods issue and invoice documents.<\/p>\n<h2>Three understanding questions<\/h2>\n<p>1. Does goods issue prove customer receipt?<\/p>\n<p>2. Why can requested and confirmed dates differ?<\/p>\n<p>3. What is documented but not demonstrated here?<\/p>\n<p>Status: answers not supplied; understanding not assessed. Review before claiming mastery. Building all phases was authorized; this does not substitute for your learning review.<\/p>"}, {"path": "phase-06/assessment.md", "html": "<h1>Desk-based fit-to-standard assessment<\/h1>\n<p>Independent simulated portfolio · 2026-10-11 · AI-assisted draft; learner review pending.<\/p>\n<p>fit-gap.csv covers all 15 functional requirements. Supported in principle means relevant standard concepts exist, not that all acceptance criteria are satisfied. Process/configuration change means policy and settings must be demonstrated. Integration/extension candidate means investigate standard capture first. Unresolved means evidence is insufficient.<\/p>\n<p>NFR assessment: NFR-001 uses broad role capability SAP-007 but exact segregation is unvalidated; NFR-002 audit field coverage/retention unresolved; NFR-003 refresh architecture unresolved; NFR-004 requires real users; NFR-005 is demonstrated only on the synthetic data subset. No SAP system acceptance is claimed.<\/p>\n<p>Prioritise demos for blocked release, partial delivery, invoice retries/corrections and event-level receipt capture. An external receipt feed could require interface monitoring, retries, security, data mapping and release regression testing. A custom exception view also creates maintenance and access-control obligations. Prefer a standard report plus a controlled exception register until an evidenced gap justifies more.<\/p>\n<p>The locally built portfolio viewer is a learning presentation, not a proposed SAP production extension or proof of FR implementation.<\/p>"}, {"path": "phase-06/learning-review.md", "html": "<h1>Phase 6 learning review — Fit-to-standard<\/h1>\n<p>Independent simulated portfolio · 2026-10-11 · AI-assisted draft; learner review pending.<\/p>\n<h2>Purpose and essential concept<\/h2>\n<p>Fit assessment compares a need with evidence and identifies remaining validation.<\/p>\n<h2>Practical task<\/h2>\n<p>Choose one unresolved fit and propose a standard-first experiment.<\/p>\n<h2>Three understanding questions<\/h2>\n<p>1. Why is a broad feature not proof of exact fit?<\/p>\n<p>2. When would an extension be justified?<\/p>\n<p>3. What maintenance cost can an extension create?<\/p>\n<p>Status: answers not supplied; understanding not assessed. Review before claiming mastery. Building all phases was authorized; this does not substitute for your learning review.<\/p>"}, {"path": "phase-07/backlog.md", "html": "<h1>Focused product backlog<\/h1>\n<p>Independent simulated portfolio · 2026-10-11 · AI-assisted draft; learner review pending.<\/p>\n<p>backlog.csv contains 15 substantive proposed stories grouped by capability. Each names a role, business value, linked requirement, Given/When/Then criteria, priority, dependencies and exception coverage. Specific fixtures and actions are in the linked UAT cases rather than duplicating long steps in each story.<\/p>\n<p>Suggested sequencing: US-001/003/005/014 establish input and controls; US-004/006/007 handle fulfilment and cancellation; US-008/009/010 handle billing; US-011 covers receipts; US-002/012/013/015 depend on reliable linked information. This is dependency reasoning, not a sprint commitment. No velocity or delivered SAP increment is claimed.<\/p>\n<p>Analysis tasks are separate: AT-001 verify exact credit-release roles; AT-002 define correction route; AT-003 validate receipt capture; AT-004 test reporting extraction/grain; AT-005 conduct actual usability review. They are evidence-gathering tasks, not user-facing product stories.<\/p>"}, {"path": "phase-07/learning-review.md", "html": "<h1>Phase 7 learning review — Backlog<\/h1>\n<p>Independent simulated portfolio · 2026-10-11 · AI-assisted draft; learner review pending.<\/p>\n<h2>Purpose and essential concept<\/h2>\n<p>Stories express a role, need and value; acceptance criteria define observable outcomes.<\/p>\n<h2>Practical task<\/h2>\n<p>Write an extra negative acceptance criterion for partial delivery.<\/p>\n<h2>Three understanding questions<\/h2>\n<p>1. Which dependencies affect US-004?<\/p>\n<p>2. Is researching an SAP page a product story?<\/p>\n<p>3. Why does a backlog not prove delivery experience?<\/p>\n<p>Status: answers not supplied; understanding not assessed. Review before claiming mastery. Building all phases was authorized; this does not substitute for your learning review.<\/p>"}, {"path": "phase-08/analysis.md", "html": "<h1>Synthetic data model, analysis and reproducibility<\/h1>\n<p>Independent simulated portfolio · 2026-10-11 · AI-assisted draft; learner review pending.<\/p>\n<h2>Model before generation<\/h2>\n<div class=\"scroll\"><table><thead><tr><th>Table<\/th><th>Grain<\/th><th>Key<\/th><th>Relationship<\/th><\/tr><\/thead><tbody><tr><td>customers<\/td><td>One fictional customer<\/td><td>customer_id<\/td><td>None<\/td><\/tr><tr><td>products<\/td><td>One stocked product<\/td><td>product_id<\/td><td>None<\/td><\/tr><tr><td>orders<\/td><td>One single-line order<\/td><td>order_id<\/td><td>customer_id → customers; product_id → products<\/td><\/tr><tr><td>deliveries<\/td><td>One shipment for an order<\/td><td>delivery_id<\/td><td>order_id → orders<\/td><\/tr><tr><td>invoices<\/td><td>One active net-only invoice per delivery<\/td><td>invoice_id<\/td><td>delivery_id → deliveries<\/td><\/tr><tr><td>receipts<\/td><td>One incoming net-only receipt<\/td><td>receipt_id<\/td><td>customer_id → customers<\/td><\/tr><tr><td>allocations<\/td><td>One receipt-to-invoice allocation<\/td><td>allocation_id<\/td><td>receipt_id → receipts; invoice_id → invoices<\/td><\/tr><tr><td>events<\/td><td>One intake/quality/manual/cancellation event<\/td><td>event_id<\/td><td>order_id → orders<\/td><\/tr><\/tbody><\/table><\/div>\n<p>All records are synthetic, generated with Python random seed 20261011. 300 orders, 20 customers, five products and one warehouse; single line per order is a deliberate simplification. A future multi-line model needs order_items and line-level delivery/invoice links. Receipts and invoices can have multiple allocation rows structurally, although this generator mainly demonstrates split payments per invoice plus unmatched receipts rather than every possible many-to-many pattern.<\/p>\n<p>Generation uses an intake cohort from 1 July through 11 October 2026, snapshot 11 October 2026. Orders received near the cutoff have less time to finish; open and future-due counts must be shown. Dates are UK business-local calendar dates; weekends are not excluded. NS-ORD-1001 preserves the Phase 1 facts and remains unconfirmed/unfulfilled. Other distributions are designed teaching examples, not calibrated observations. All financial amounts are <strong>net-only integer pence<\/strong>, with VAT deliberately excluded from invoices and receipts; this is not a complete UK receivables ledger.<\/p>\n<h2>Generation assumptions<\/h2>\n<p>Every seventeenth non-base order is cancelled before dispatch. Every nineteenth is left without fulfilment. Some permitted orders split into two shipments; some remain partial. Stock-shortage labels add delay. Billing-handoff labels add billing delay. Errors and manual touches are explicit event records. Pending future events are omitted, not recorded as actuals. No returns, invoice corrections, overpayments, discounts, tax or bad debt are generated; those scenarios remain in design/UAT. This bias intentionally illustrates the problems and cannot prove causation.<\/p>\n<h2>Relationships and double-counting<\/h2>\n<p>orders 1:N deliveries; deliveries 1:1 invoices in this simplified dataset; invoices 1:N allocations and receipts 1:N allocations. Aggregate delivery quantity to order, allocations to invoice/receipt, and event flags to order before joining. Never SUM order value after joining raw deliveries and allocations. The four-order fixture demonstrates that £10,000 remains £10,000 regardless of child-row count.<\/p>\n<h2>Executed baseline results — not achieved improvements<\/h2>\n<div class=\"scroll\"><table><thead><tr><th>id<\/th><th>name<\/th><th>value<\/th><th>unit<\/th><th>denominator<\/th><th>basis<\/th><\/tr><\/thead><tbody><tr><td>KPI-001<\/td><td>Order cycle time<\/td><td>6.1595<\/td><td>calendar days<\/td><td>232<\/td><td>Synthetic baseline; not measured business performance<\/td><\/tr><tr><td>KPI-002<\/td><td>On-time delivery<\/td><td>49.0706<\/td><td>%<\/td><td>269<\/td><td>Synthetic baseline; not measured business performance<\/td><\/tr><tr><td>KPI-003<\/td><td>Order fulfilment rate<\/td><td>84.8933<\/td><td>%<\/td><td>14530<\/td><td>Synthetic baseline; not measured business performance<\/td><\/tr><tr><td>KPI-004<\/td><td>Billing cycle time<\/td><td>1.9504<\/td><td>calendar days<\/td><td>262<\/td><td>Synthetic baseline; not measured business performance<\/td><\/tr><tr><td>KPI-005<\/td><td>Order error rate<\/td><td>22.3333<\/td><td>%<\/td><td>300<\/td><td>Synthetic baseline; not measured business performance<\/td><\/tr><tr><td>KPI-006<\/td><td>Manual-touch rate<\/td><td>76.3333<\/td><td>%<\/td><td>300<\/td><td>Synthetic baseline; not measured business performance<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Context: 17 cancelled; 232 fully received; 51 open noncancelled; 1 unknown initial promise; 21 orders with multiple deliveries; 21 partially received; 20 partially paid invoices; 22 goods-issued deliveries still unbilled. These exclusions matter: completed-only cycle and billed-only billing means can look better while unfinished work grows. On-time performance is 132/269 due promises, with overdue open orders counted as failures.<\/p>\n<p>Synthetic invoice balances outstanding total £142,705.00; unmatched cash totals £3,060.00. These are model balances, not real cash or savings. Total order value includes cancelled demand; do not call it revenue. Results describe the generator, not NorthStar operations.<\/p>\n<h2>Reproduce and inspect<\/h2>\n<p>Run <code>python scripts/build_data.py<\/code> from the project folder; it uses only Python&#x27;s standard library. CSVs, SQLite database, results JSON, checks and SQL are generated. kpi_queries.sql independently computes the six measures in SQLite. 24 checks passed, including keys, references, date/quantity/amount bounds, known fixture and Python/SQL agreement. SHA-256 hashes in results.json make deterministic reruns comparable. These are executed data checks, not SAP UAT.<\/p>\n<p>LibreOffice route: import each CSV with comma delimiter and UTF-8; retain identifiers as text. Use order_summary.csv as the order-grain table for pivots. It is an exported derived table; source CSV changes require regenerating it. For on-time calculations filter noncancelled known promises due by snapshot; count full receipt by original promise. For billing join invoices to deliveries once at delivery ID. Power BI is optional, not required.<\/p>\n<h2>Dashboard design and implementation<\/h2>\n<p>The offline viewer shows six cohort-wide KPI cards, denominator/exclusion context, searchable orders with linked shipment/invoice/payment details, requirement traceability, tests and source evidence. Order-list search filters the list only; KPI cards stay clearly labelled as the full snapshot. No role permissions or transactional SAP behaviours are simulated by the viewer.<\/p>\n<h2>Future-state scenario boundary<\/h2>\n<p>No future-state KPI uplift is presented. Phase 10 models illustrative handling-time capacity separately; it is not subtracted from this baseline or claimed as achieved.<\/p>"}, {"path": "phase-08/learning-review.md", "html": "<h1>Phase 8 learning review — Data and KPIs<\/h1>\n<p>Independent simulated portfolio · 2026-10-11 · AI-assisted draft; learner review pending.<\/p>\n<h2>Purpose and essential concept<\/h2>\n<p>Grain is what one row represents. Counting errors is only meaningful when the denominator is clear.<\/p>\n<h2>Practical task<\/h2>\n<p>Recalculate the four-order fixture manually and compare the output.<\/p>\n<h2>Three understanding questions<\/h2>\n<p>1. Why does joining deliveries and allocations multiply rows?<\/p>\n<p>2. How do open overdue orders affect on-time delivery?<\/p>\n<p>3. Why are synthetic patterns not business findings?<\/p>\n<p>Status: answers not supplied; understanding not assessed. Review before claiming mastery. Building all phases was authorized; this does not substitute for your learning review.<\/p>"}, {"path": "phase-09/learning-review.md", "html": "<h1>Phase 9 learning review — UAT<\/h1>\n<p>Independent simulated portfolio · 2026-10-11 · AI-assisted draft; learner review pending.<\/p>\n<h2>Purpose and essential concept<\/h2>\n<p>UAT checks business needs in a system with evidence. A design walkthrough checks the planned logic.<\/p>\n<h2>Practical task<\/h2>\n<p>Walk TC-014 and explain partial versus residual payment.<\/p>\n<h2>Three understanding questions<\/h2>\n<p>1. Why are all SAP cases Not executed?<\/p>\n<p>2. What is the difference between severity and priority?<\/p>\n<p>3. What evidence is needed to mark a test passed?<\/p>\n<p>Status: answers not supplied; understanding not assessed. Review before claiming mastery. Building all phases was authorized; this does not substitute for your learning review.<\/p>"}, {"path": "phase-09/uat-plan.md", "html": "<h1>UAT plan and honest validation status<\/h1>\n<p>Independent simulated portfolio · 2026-10-11 · AI-assisted draft; learner review pending.<\/p>\n<h2>Purpose<\/h2>\n<p>User acceptance testing checks whether business users can meet agreed needs in the configured solution. A requirements walkthrough checks the design. Executing a spreadsheet or data script does not execute SAP UAT.<\/p>\n<h2>Entry criteria<\/h2>\n<p>Reviewed requirements/rules and traceability; known release/configuration and scope; non-production tenant; authorized test roles; controlled synthetic master/transaction data; reset approach; approved expected results; evidence storage and agreed severity. These entry conditions have not been met for SAP execution.<\/p>\n<h2>Exit criteria for a future SAP test cycle<\/h2>\n<p>All Must scenarios executed with evidence; no open critical/high issue preventing safe order, financial or access processing; medium/low residual issues explicitly accepted by accountable owners with workarounds; regression/coverage reviewed; actual business acceptance recorded. No fabricated approval or acceptance is supplied here.<\/p>\n<h2>Severity<\/h2>\n<p>Critical: unauthorized financial release, severe data corruption or widespread inability to operate safely. High: core flow blocked or materially wrong quantity/value without safe workaround. Medium: restricted scenario affected with a controlled workaround. Low: cosmetic/help issue without material processing impact. Priority is how soon to fix, based on business timing and impact; it is not automatically identical to severity.<\/p>\n<h2>Execution records<\/h2>\n<p>All 22 cases in uat-cases.csv remain <strong>Not executed<\/strong>. No SAP defects or screenshots exist. Synthetic data and KPI checks are separately recorded in phase-08/data/data_checks.csv. The fixture oracle exercises analytical logic related to TC-018 but does not change its SAP status. Document reviews are recorded in walkthrough.md as design issues.<\/p>\n<p>For later execution, save actual inputs, time, user role, relevant document IDs, observed result and evidence path. If blocked before the action, mark Blocked with reason—not Passed. Do not use generated concept artwork as evidence.<\/p>"}, {"path": "phase-09/walkthrough.md", "html": "<h1>Executed desk-based design walkthrough<\/h1>\n<p>Independent simulated portfolio · 2026-10-11 · AI-assisted draft; learner review pending.<\/p>\n<p>Execution type: AI-assisted document/data walkthrough, 11 October 2026. No SAP interaction and no stakeholder participation.<\/p>\n<div class=\"scroll\"><table><thead><tr><th>Walkthrough<\/th><th>Design observation<\/th><th>Resolution / status<\/th><\/tr><\/thead><tbody><tr><td>TC-004/005: 100 ordered, 60 available<\/td><td>On-hand vs available wording can lead to unsupported promise<\/td><td>Base scenario stays unresolved; test variant explicitly assumes availability and permission<\/td><\/tr><tr><td>TC-011: dispatch Monday, posting Tuesday, receipt Wednesday<\/td><td>One delivery date would obscure service and posting lag<\/td><td>RULE-006 and dataset separate all three events<\/td><\/tr><tr><td>TC-014: £900 toward £1,500<\/td><td>Analytical remaining balance could be mistaken for SAP invoice clearing<\/td><td>SAP-006 distinction and net-only model limitation added<\/td><\/tr><tr><td>TC-018: multiple deliveries and payments<\/td><td>Raw child joins multiply order values<\/td><td>Aggregate to order/invoice grain; independent SQL and fixture checks executed<\/td><\/tr><tr><td>TC-020/021: audit and usability<\/td><td>Offline viewer cannot prove production permissions or user task success<\/td><td>System controls and actual user review remain pending<\/td><\/tr><\/tbody><\/table><\/div>\n<p>DI-001 (resolved design issue): date semantics needed separation. DI-002 (resolved design issue): payment model needed explicit distinction from SAP open-item postings. DI-003 (open design issue): full receipt-data capture and audit retention need tenant/policy validation. These are not executed SAP defects.<\/p>"}, {"path": "phase-10/business-case.md", "html": "<h1>Illustrative business case — no achieved savings<\/h1>\n<p>Independent simulated portfolio · 2026-10-11 · AI-assisted draft; learner review pending.<\/p>\n<h2>Decision question<\/h2>\n<p>What is the proportionate next step for the three process problems? A free portfolio does not imply a real ERP implementation is free. All implementation costs below are hypothetical business planning placeholders, distinct from the learner&#x27;s £0 required software-purchase route.<\/p>\n<div class=\"scroll\"><table><thead><tr><th>Option<\/th><th>One_off_GBP<\/th><th>Annual_running_GBP<\/th><th>Minutes_saved_per_order<\/th><th>Annual_orders_assumed<\/th><th>Loaded_hourly_rate_GBP<\/th><th>Annual_capacity_hours<\/th><th>Capacity_equivalent_GBP<\/th><th>Cash_savings_GBP<\/th><th>Cost_basis<\/th><\/tr><\/thead><tbody><tr><td>A: Improve manual controls<\/td><td>2000<\/td><td>500<\/td><td>2<\/td><td>6000<\/td><td>25<\/td><td>200.0<\/td><td>5000.0<\/td><td>Unproven<\/td><td>Illustrative planning placeholder, not supplier quote or SAP price<\/td><\/tr><tr><td>B: Standardise process and shared reporting<\/td><td>8000<\/td><td>1500<\/td><td>5<\/td><td>6000<\/td><td>25<\/td><td>500.0<\/td><td>12500.0<\/td><td>Unproven<\/td><td>Illustrative planning placeholder, not supplier quote or SAP price<\/td><\/tr><tr><td>C: SAP-aligned future state<\/td><td>60000<\/td><td>18000<\/td><td>8<\/td><td>6000<\/td><td>25<\/td><td>800.0<\/td><td>20000.0<\/td><td>Unproven<\/td><td>Illustrative planning placeholder, not supplier quote or SAP price<\/td><\/tr><\/tbody><\/table><\/div>\n<p>One-off categories include discovery, design, data cleansing, configuration or spreadsheet setup, integration, testing, training and contingency. Annual categories include administration, support, subscriptions if applicable, monitoring and regression. Option C is a broad allowance, not a SAP licence quote; commercial discovery would be mandatory. These estimates do not come from our synthetic dataset.<\/p>\n<p>At 6,000 assumed annual orders, 5 minutes saved each equals 500 hours/year. At £25/hour, this is £12,500 of <strong>capacity equivalent<\/strong>, not cash savings. Staff can use time for other work; payroll falls only if a specific cost-removal decision exists. Do not also count the same minutes as fewer errors, faster billing or headcount savings. Earlier billing might affect working capital, but no cash-flow benefit is calculated without actual payment behaviour and financing assumptions.<\/p>\n<h2>Sensitivity and investment caution<\/h2>\n<p>For Option B, 2–8 minutes saved and £20–£30/hour gives 200–800 hours and £4,000–£24,000 capacity equivalent per year. At the central assumptions, dividing £8,000 by (£12,500−£1,500) would look attractive, but calling that cash payback would be misleading because salary spending has not been shown to fall. No cash ROI or payback is claimed. To calculate one meaningfully, establish incremental cash benefits, costs, timing and a defensible horizon first.<\/p>\n<h2>Recommendation<\/h2>\n<p>Start with Option A&#x27;s ownership and reconciliation controls, then validate Option B against genuine baseline evidence. Keep the SAP-aligned design as a reference option requiring system fit, entitlements, costs and business readiness assessment. This sequence does not presume SAP is the best investment. Benefits depend on adoption, clean data, operating discipline and actual opportunities to redeploy capacity.<\/p>"}, {"path": "phase-10/change-and-risk.md", "html": "<h1>Risks, change and support<\/h1>\n<p>Independent simulated portfolio · 2026-10-11 · AI-assisted draft; learner review pending.<\/p>\n<p>Risk scoring uses illustrative 1–5 likelihood and impact scales; 1 is low, 5 high, score is their product. Scores guide discussion, not quantified loss forecasts. Ten risks are in risks.csv. RISK-007 and RISK-010 remain particularly important because desk research is not system evidence or learner mastery.<\/p>\n<div class=\"scroll\"><table><thead><tr><th>Role<\/th><th>Change<\/th><th>Training<\/th><th>Communication<\/th><th>Support<\/th><\/tr><\/thead><tbody><tr><td>Sales<\/td><td>Promise only checked quantity/date; retain original promise; correction queue<\/td><td>45-minute NS-ORD-1001 and missing-data exercise<\/td><td>Before trial: explain why checks protect promise quality<\/td><td>Sales key user → process owner → IT if technical<\/td><\/tr><tr><td>Warehouse<\/td><td>Separate physical dispatch from posting; resolve quantity mismatch<\/td><td>45-minute partial pick and delayed-posting exercise<\/td><td>Daily handoff checklist and unresolved stock review<\/td><td>Warehouse key user → Warehouse owner → IT<\/td><\/tr><tr><td>Finance<\/td><td>Own billable population; controlled correction and payment handling<\/td><td>60-minute billing retry, credit release and partial-payment cases<\/td><td>Daily unbilled/credit/payment review; weekly control issues<\/td><td>Finance key user → Finance owner → IT<\/td><\/tr><tr><td>Customer Service<\/td><td>Use authoritative status; capture partial agreement and next action<\/td><td>30-minute status enquiry and customer agreement role-play<\/td><td>Short quick guide; weekly feedback session in pilot<\/td><td>Customer Service key user → relevant process owner<\/td><\/tr><tr><td>IT<\/td><td>Support role matrix, data contracts, refresh and evidence retention<\/td><td>60-minute access, failed-refresh and reconciliation exercise<\/td><td>Release notes and change-impact review before changes<\/td><td>IT support → authorized platform support where applicable<\/td><\/tr><\/tbody><\/table><\/div>\n<p>Training durations are proposed session lengths based on a few concrete scenarios, not measured learning requirements. Use job aids, a practice task, observation and feedback; attendance alone does not establish competence. Communications should explain the changed rule, why it matters, who owns the next step and where to get help. No training has been delivered.<\/p>\n<p>Suggested support: role key user triages process questions; business owner decides policy; IT handles access/integration/report failures; specialist/vendor support is a possible later dependency, not a purchased service. Critical access/financial integrity problems require immediate containment and Finance/IT escalation; other issues enter a daily triage queue. Actual service levels and support coverage require agreement.<\/p>"}, {"path": "phase-10/learning-review.md", "html": "<h1>Phase 10 learning review — Risks, change and business case<\/h1>\n<p>Independent simulated portfolio · 2026-10-11 · AI-assisted draft; learner review pending.<\/p>\n<h2>Purpose and essential concept<\/h2>\n<p>A business case compares options, costs and uncertain benefits. Saved minutes are capacity unless spending actually falls.<\/p>\n<h2>Practical task<\/h2>\n<p>Change the illustrative minutes saved and inspect sensitivity.<\/p>\n<h2>Three understanding questions<\/h2>\n<p>1. Can staff capacity be counted again as cash savings?<\/p>\n<p>2. Why might better manual controls be the first investment?<\/p>\n<p>3. What would make payback meaningful?<\/p>\n<p>Status: answers not supplied; understanding not assessed. Review before claiming mastery. Building all phases was authorized; this does not substitute for your learning review.<\/p>"}, {"path": "phase-11/case-study.md", "html": "<h1>Case study and lessons learned<\/h1>\n<p>Independent simulated portfolio · 2026-10-11 · AI-assisted draft; learner review pending.<\/p>\n<h2>Context<\/h2>\n<p>Independent simulated analysis of NorthStar Manufacturing UK, a one-company, one-warehouse domestic stock seller. Supplied problems: poor visibility, stock delays and manual billing handoffs. The learner&#x27;s quality-review and error-analysis background motivates attention to controls and evidence; no real client engagement is claimed.<\/p>\n<h2>Analysis and decisions<\/h2>\n<p>The pack uses explicitly invented discovery to explore conflicting promises, partial deliveries, credit and billing ownership. AS-IS and TO-BE flowcharts distinguish physical events from postings. Three business requirements decompose into 15 functional and five non-functional requirements, 15 stories and 22 planned UAT cases. Traceability links problems, process changes, tests and measures. Official SAP references support broad standard-process fit; exact configuration and several controls remain unresolved.<\/p>\n<p>The main decisions were to preserve the original promise date, require partial-delivery agreement, assign Finance the billable-population review, distinguish partial payment from clearing, and aggregate child records before combining measures. Standard processes and manual controls were considered before extensions.<\/p>\n<h2>Evidence produced<\/h2>\n<p>The reproducible dataset contains 300 synthetic orders, 285 shipments, 262 invoices and 197 allocations. Six KPI calculations agree between Python and SQLite; 24 data checks passed. The offline viewer exposes results and records but is not an SAP application. All 22 SAP UAT cases remain Not executed.<\/p>\n<h2>Limitations and next steps<\/h2>\n<p>No real stakeholder research, tenant demonstration, implementation or measured savings. Data is simplified to one line per order and net-only finances; it omits corrections, VAT and returns. A real project needs agreed policies, broader representative data, configuration/integration/security testing and business acceptance. Learner understanding and personal contribution still need review before resume use.<\/p>\n<h2>Lessons from building the pack<\/h2>\n<p>An attractive dashboard is not evidence of a sound denominator. Posted goods issue is not proof of receipt. A plausible root cause is still a hypothesis. A linked analytical payment amount is not the same as an SAP clearing document. A generated test list is not executed UAT. These are artifact-development observations, not retrospective lessons from a live implementation.<\/p>"}, {"path": "phase-11/executive-presentation.md", "html": "<h1>Executive presentation — ten slides<\/h1>\n<p>Independent simulated portfolio; editable PPTX in downloads.<\/p>\n<h2>1. NorthStar Manufacturing UK<\/h2>\n<p>SAP S/4HANA Order-to-Cash<\/p>\n<p>Business Process Analysis &amp; Transformation<\/p>\n<p>- Independent simulated portfolio<\/p>\n<p>- Public Edition 2602 research reference<\/p>\n<p>- Free documentation and synthetic-data route<\/p>\n<p>Speaker note: Explain that no real client, production configuration or implementation is represented.<\/p>\n<h2>2. The business problem<\/h2>\n<p>Three connected operational problems<\/p>\n<p>- Poor visibility → repeated enquiries and unclear ownership<\/p>\n<p>- Stock delays → unsupported promises and partial-delivery decisions<\/p>\n<p>- Manual billing handoffs → eligible deliveries waiting for review<\/p>\n<p>Speaker note: Consequences are hypotheses from the supplied fictional scenario, not real observed findings.<\/p>\n<h2>3. Scope and representative order<\/h2>\n<p>One company · one warehouse · domestic B2B · GBP<\/p>\n<p>- NS-ORD-1001: 100 brackets × £25 = £2,500 net<\/p>\n<p>- 60 physically on hand; availability remains unresolved<\/p>\n<p>- Requested receipt 9 October; no confirmed promise invented<\/p>\n<p>- Order receipt through payment allocation and reporting<\/p>\n<p>Speaker note: Manufacturing planning, procurement redesign, international trade, complex tax, full migration and deployment are excluded.<\/p>\n<h2>4. Discovery and process choices<\/h2>\n<p>Role-play reveals decisions, not stakeholder approval<\/p>\n<p>- Validate data before confirmation; retain the original promise<\/p>\n<p>- Require agreement for partial delivery; keep remainder open<\/p>\n<p>- Finance owns credit release and billable-population review<\/p>\n<p>- Separate physical dispatch, goods-issue posting and receipt<\/p>\n<p>Speaker note: Explain alternative causes for late billing; email handoff is a hypothesis, not a proven root cause.<\/p>\n<h2>5. Requirements to validation<\/h2>\n<p>One traceable evidence chain<\/p>\n<p>- 23 requirements: 3 business + 15 functional + 5 non-functional<\/p>\n<p>- 15 stories and 12 rules with explicit exceptions<\/p>\n<p>- Example: PROB-002 → BR-002 → FR-004 → PC-004<\/p>\n<p>- US-004 → TC-005/006 → KPI-003<\/p>\n<p>Speaker note: All requirements and stories are proposed. Trace links exist but actual business validation is pending.<\/p>\n<h2>6. SAP standard-first assessment<\/h2>\n<p>Documented capability is not demonstrated configuration<\/p>\n<p>- Seven official sources reviewed; two pages explicitly unverified<\/p>\n<p>- BD9 stock-sales reference and payment handling researched<\/p>\n<p>- 15 functional fit assessments remain desk-based<\/p>\n<p>- Validate exact roles, corrections, receipt capture and audit coverage<\/p>\n<p>Speaker note: Reference is Public Edition 2602; Learning pages are not release-pinned. Entitlements and configuration are not established.<\/p>\n<h2>7. Synthetic baseline<\/h2>\n<p>Reproducible analysis, not achieved performance<\/p>\n<p>Speaker note: Single-line orders, net-only finance, seeded data. On-time denominator includes overdue open orders. Cycle time excludes unfinished orders; billing mean excludes unbilled deliveries.<\/p>\n<h2>8. Validation and remaining gates<\/h2>\n<p>Honest execution status<\/p>\n<p>- 24 synthetic data checks passed; six Python/SQL KPIs agree<\/p>\n<p>- 22 SAP UAT cases designed; 0 executed<\/p>\n<p>- Desk walkthrough issues kept separate from SAP defects<\/p>\n<p>- Learner explanation, real discovery and tenant testing remain pending<\/p>\n<p>Speaker note: Do not turn data check success into a passed SAP UAT case or personal experience claim.<\/p>\n<h2>9. Options and illustrative economics<\/h2>\n<p>Improve controls before assuming a large investment<\/p>\n<p>- Compare manual controls, process standardisation and SAP-aligned design<\/p>\n<p>- 6,000 orders × 5 minutes = 500 hours annual capacity<\/p>\n<p>- At £25/hour: £12,500 capacity equivalent, not cash savings<\/p>\n<p>- No cash ROI/payback claimed; costs are planning placeholders<\/p>\n<p>Speaker note: Recommend manual ownership/reconciliation first, then validate process standardisation. No SAP price quote or achieved benefit is represented.<\/p>\n<h2>10. What this portfolio demonstrates<\/h2>\n<p>A reviewable foundation, with explicit limits<\/p>\n<p>- Problem → evidence → requirements → design → validation reasoning<\/p>\n<p>- Reproducible synthetic analysis and source-labelled SAP research<\/p>\n<p>- Next: learner review, policy validation and system demonstration<\/p>\n<p>- AI drafted/generated artifacts; personal contribution must be stated accurately<\/p>\n<p>Speaker note: Final learning gate remains open until the learner can explain decisions without reading a script. No employment guarantee.<\/p>"}, {"path": "phase-11/learning-review.md", "html": "<h1>Phase 11 learning review — Packaging<\/h1>\n<p>Independent simulated portfolio · 2026-10-11 · AI-assisted draft; learner review pending.<\/p>\n<h2>Purpose and essential concept<\/h2>\n<p>A portfolio tells a defensible evidence story, not a list of files.<\/p>\n<h2>Practical task<\/h2>\n<p>Give a two-minute tour linking a problem to a requirement, story and test.<\/p>\n<h2>Three understanding questions<\/h2>\n<p>1. What is the strongest evidence in this pack?<\/p>\n<p>2. Which limitation should an interviewer hear?<\/p>\n<p>3. What would you remove to reduce unnecessary documentation?<\/p>\n<p>Status: answers not supplied; understanding not assessed. Review before claiming mastery. Building all phases was authorized; this does not substitute for your learning review.<\/p>"}, {"path": "phase-12/interview-and-resume.md", "html": "<h1>Truthful resume and interview preparation<\/h1>\n<p>Independent simulated portfolio · 2026-10-11 · AI-assisted draft; learner review pending.<\/p>\n<h2>Contribution check — required before using personal claims<\/h2>\n<p>The artifacts and automated analyses were produced with AI assistance. The learner has not yet supplied review answers or demonstrated independent reproduction. Therefore the statements below are <strong>project-description drafts<\/strong>, not approved personal achievement claims. Use “I analysed/designed/tested” only after personally performing and explaining the relevant work.<\/p>\n<h2>Four evidence-supported project-description bullets<\/h2>\n<p>- Independent simulated SAP S/4HANA Order-to-Cash portfolio covering a fictional UK manufacturer, with current/future process flows and a source-labelled SAP reference assessment.<\/p>\n<p>- Portfolio includes 23 requirements, 15 user stories and 22 planned UAT cases linked through traceability; SAP test cases are labelled Not executed.<\/p>\n<p>- Reproducible analysis covers 300 synthetic orders and six KPIs, with separate order, delivery, invoice and payment-allocation grains and Python/SQLite reconciliation.<\/p>\n<p>- Compares manual-control, process-standardisation and SAP-aligned options using illustrative costs and capacity assumptions, without claiming achieved savings.<\/p>\n<h2>60-second overview to adapt truthfully<\/h2>\n<p>“My portfolio is an independent simulation of Order-to-Cash at a fictional UK manufacturer. It focuses on order visibility, stock delays and billing handoffs. The pack connects discovery assumptions to process changes, requirements, stories and planned tests. It uses official SAP Public Edition sources as a reference, not a live implementation. A 300-order synthetic dataset demonstrates six KPIs and the importance of avoiding duplicate values across shipments and payments. AI helped draft and generate the artifacts; my personal contribution so far is [state only work actually completed]. I am working through the decisions and checks so I can explain them independently. All SAP UAT cases remain unexecuted.”<\/p>\n<h2>Five-minute walkthrough<\/h2>\n<p>0:00–0:45: scenario, supplied problems and evidence boundary. 0:45–1:30: NS-ORD-1001 and on-hand versus available stock. 1:30–2:15: AS-IS hypothesis and TO-BE ownership. 2:15–3:00: FR-004 → US-004 → TC-005/006 → KPI-003. 3:00–4:00: dataset grains, original-promise denominator and executed checks. 4:00–4:40: desk-based SAP fit, unexecuted UAT and option comparison. 4:40–5:00: personal contribution, limitations and next validation step.<\/p>\n<h2>Interview questions and challenges<\/h2>\n<p>1. BA: How would you turn “poor visibility” into a requirement? Follow-up: which role, fields and freshness matter? Strong answer names observable outcomes and evidence.<\/p>\n<p>2. Discovery: Sales wants Friday delivery, Warehouse cannot confirm. What do you do? Follow-up: how do you distinguish request, estimate and commitment?<\/p>\n<p>3. Process: What proves the customer received the goods? Follow-up: what if dispatch and posting occur on different dates?<\/p>\n<p>4. SAP: Why choose Public Edition as a reference? Follow-up: which exact claims still require tenant verification?<\/p>\n<p>5. Controls: Who can release credit and why? Follow-up: what if a separate order block remains?<\/p>\n<p>6. Requirements: Give a negative acceptance criterion for partial delivery. Follow-up: what happens to the remaining quantity?<\/p>\n<p>7. Data: How can a join inflate order value? Follow-up: show the grain before and after aggregation.<\/p>\n<p>8. KPI: Should an open overdue order be excluded from on-time delivery? Follow-up: why retain the original promise date?<\/p>\n<p>9. UAT: Can TC-018 be Passed because Python checks passed? Follow-up: what evidence would a system test require?<\/p>\n<p>10. Finance: Does a partial payment clear the original invoice? Follow-up: contrast partial and residual treatment using SAP-006.<\/p>\n<p>11. Business case: Are 500 saved hours £12,500 cash savings? Follow-up: what decision would make cash benefits real?<\/p>\n<p>12. Integrity: What did you do and what did AI do? Follow-up: reproduce one calculation without relying on the generated explanation.<\/p>\n<h2>Coaching rubric<\/h2>\n<p>For each answer record 0 = incorrect/no explanation, 1 = partial, 2 = correct with example and limitation. Do not assign scores before answers exist. Re-teach stock availability, event dates, grain or test status if confused. Readiness requires explaining the main decisions without a script, not memorizing every file. Employment is not guaranteed.<\/p>"}, {"path": "phase-12/learning-review.md", "html": "<h1>Phase 12 learning review — Interview preparation<\/h1>\n<p>Independent simulated portfolio · 2026-10-11 · AI-assisted draft; learner review pending.<\/p>\n<h2>Purpose and essential concept<\/h2>\n<p>A credible answer explains your decisions and actual contribution. AI drafting is not personal execution.<\/p>\n<h2>Practical task<\/h2>\n<p>Record a 60-second overview without reading the script.<\/p>\n<h2>Three understanding questions<\/h2>\n<p>1. Which work did you personally validate?<\/p>\n<p>2. Which claim would overstate SAP experience?<\/p>\n<p>3. How would you investigate a result you disagree with?<\/p>\n<p>Status: answers not supplied; understanding not assessed. Review before claiming mastery. Building all phases was authorized; this does not substitute for your learning review.<\/p>"}, {"path": "registers/assumptions.md", "html": "<h1>Assumptions, constraints and dependencies<\/h1>\n<p>Updated 8 October 2026. Supplied scenario facts describe a fictional business, not verified real operations.<\/p>\n<div class=\"scroll\"><table><thead><tr><th>ID<\/th><th>Type<\/th><th>Entry<\/th><th>Status / treatment<\/th><\/tr><\/thead><tbody><tr><td>ASM-001<\/td><td>Supplied scenario fact<\/td><td>One company, one warehouse, domestic stock sales, GBP reporting<\/td><td>Fixed initial scope<\/td><\/tr><tr><td>ASM-002<\/td><td>Fictional assumption<\/td><td>Current work uses fragmented records and manual communications<\/td><td>Specify during current-state analysis<\/td><\/tr><tr><td>ASM-003<\/td><td>Learning assumption<\/td><td>4–6 study hours per week<\/td><td>Await learner response<\/td><\/tr><tr><td>ASM-004<\/td><td>Fictional assumption<\/td><td>Partial delivery requires defined customer agreement or policy<\/td><td>Policy unresolved<\/td><\/tr><tr><td>ASM-005<\/td><td>Fictional assumption<\/td><td>NS-ORD-1001 values in representative-order.md<\/td><td>Stable base scenario; changes must be logged<\/td><\/tr><tr><td>CON-001<\/td><td>Constraint<\/td><td>SAP access unknown<\/td><td>Documentation/data route remains available<\/td><\/tr><tr><td>CON-002<\/td><td>Constraint<\/td><td>No real client records, interviews, approvals or production evidence supplied<\/td><td>Label all simulation<\/td><\/tr><tr><td>CON-003<\/td><td>User constraint<\/td><td>All project work must avoid required paid tools or services<\/td><td>Use free documentation/data route; no paid SAP access, Office licence or hosting required<\/td><\/tr><tr><td>DEP-001<\/td><td>Dependency<\/td><td>Stock availability depends on replenishment and record accuracy<\/td><td>Record impact; procurement redesign excluded<\/td><\/tr><tr><td>DEP-002<\/td><td>Dependency<\/td><td>Billing/allocation require customer, pricing, tax and payment information<\/td><td>Define data and controls later<\/td><\/tr><tr><td>DEP-003<\/td><td>Dependency<\/td><td>SAP behaviour varies by edition, release, configuration and integration<\/td><td>Verify claims before fit assessment<\/td><\/tr><\/tbody><\/table><\/div>\n<p>No numerical business performance target or achieved improvement has been established.<\/p>\n<h2>Full-build additions — 11 October 2026<\/h2>\n<div class=\"scroll\"><table><thead><tr><th>ID<\/th><th>Type<\/th><th>Entry<\/th><th>Status / treatment<\/th><\/tr><\/thead><tbody><tr><td>ASM-006<\/td><td>Fictional operating policy<\/td><td>Daily Finance queue review; daily management snapshot before 09:00 Europe/London<\/td><td>Proposed business-local cadence; not a service-level claim<\/td><\/tr><tr><td>ASM-007<\/td><td>Analytical assumption<\/td><td>One line per order, GBP integer pence, all finance net-only with VAT omitted<\/td><td>Explicit teaching limitation<\/td><\/tr><tr><td>ASM-008<\/td><td>Analytical assumption<\/td><td>Synthetic snapshot 11 October 2026; dates are UK business-local calendar dates<\/td><td>Actual future events omitted; promises/due dates may be future<\/td><\/tr><tr><td>ASM-009<\/td><td>Business-case assumption<\/td><td>6,000 annual orders and £25 loaded hourly cost<\/td><td>Illustrative; independent of synthetic baseline<\/td><\/tr><tr><td>ASM-010<\/td><td>Learning assumption<\/td><td>Broad junior BA emphasis with ERP/process skills retained<\/td><td>Primary target role still unresolved<\/td><\/tr><tr><td>CON-004<\/td><td>Evidence constraint<\/td><td>Learner has not personally reproduced or explained artifacts in this conversation<\/td><td>Conditional resume drafts; no competence claim<\/td><\/tr><tr><td>DEP-004<\/td><td>Integration dependency<\/td><td>Receipt evidence, audit coverage and retention require validation<\/td><td>No automatic carrier integration or retention guarantee<\/td><\/tr><\/tbody><\/table><\/div>"}, {"path": "registers/decisions.md", "html": "<h1>Decision log<\/h1>\n<div class=\"scroll\"><table><thead><tr><th>ID<\/th><th>Date<\/th><th>Decision<\/th><th>Rationale / status<\/th><\/tr><\/thead><tbody><tr><td>DEC-001<\/td><td>2026-10-08<\/td><td>One phase at a time<\/td><td>User-directed; review understanding before advancing<\/td><\/tr><tr><td>DEC-002<\/td><td>2026-10-08<\/td><td>Documentation and synthetic analysis if SAP access unavailable<\/td><td>Keeps work feasible; access still unknown<\/td><\/tr><tr><td>DEC-003<\/td><td>2026-10-08<\/td><td>Provisionally reference SAP S/4HANA Cloud Public Edition<\/td><td>Defined research boundary; reference release unresolved; revisit against access<\/td><\/tr><tr><td>DEC-004<\/td><td>2026-10-08<\/td><td>Assess standard processes before extensions<\/td><td>Avoid unnecessary complexity; no capability fit yet verified<\/td><\/tr><tr><td>DEC-005<\/td><td>2026-10-08<\/td><td>Defer numeric improvement targets<\/td><td>Need measurement definitions and baseline first<\/td><\/tr><tr><td>DEC-006<\/td><td>2026-10-08<\/td><td>Store editable Phase 1 files in cloud workspace<\/td><td>User asked to work on cloud; does not establish SAP access or publication approval<\/td><\/tr><tr><td>DEC-007<\/td><td>2026-10-08<\/td><td>Select documentation and synthetic-data route with no required paid software<\/td><td>User requires free work; use Markdown, browser documents, LibreOffice-compatible copies, CSV and later Python/SQLite; SAP access remains unknown<\/td><\/tr><tr><td>DEC-008<\/td><td>2026-10-11<\/td><td>Build all twelve phases now<\/td><td>User explicitly requested the whole project; learning reviews remain pending<\/td><\/tr><tr><td>DEC-009<\/td><td>2026-10-11<\/td><td>Pin SAP reference to Public Edition 2602<\/td><td>Official feature-scope PDF reviewed; learning sources are unpinned; no tenant access inferred<\/td><\/tr><tr><td>DEC-010<\/td><td>2026-10-11<\/td><td>Use a 300-order single-line, net-only analytical dataset<\/td><td>Keeps reproducibility manageable; not a full UK tax/receivables ledger<\/td><\/tr><tr><td>DEC-011<\/td><td>2026-10-11<\/td><td>Provide an offline portfolio viewer, not hosted production software<\/td><td>Preserves free-tool constraint and original instruction not to publish without request<\/td><\/tr><tr><td>DEC-012<\/td><td>2026-10-11<\/td><td>Keep representative order unresolved in baseline<\/td><td>Design/test variants are separate; do not invent actual fulfilment<\/td><\/tr><tr><td>DEC-013<\/td><td>2026-10-11<\/td><td>Draft resume statements conditionally<\/td><td>Artifacts generated with AI; personal validation and learning review not established<\/td><\/tr><tr><td>DEC-014<\/td><td>2026-10-11<\/td><td>Add real-browser screenshots, explanatory PDFs and GitHub-ready root entry<\/td><td>User requested local run evidence and a repository they can push; no remote publication performed<\/td><\/tr><\/tbody><\/table><\/div>"}, {"path": "registers/glossary.md", "html": "<h1>Working glossary<\/h1>\n<div class=\"scroll\"><table><thead><tr><th>Term<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Order-to-Cash<\/td><td>Activities from receiving a customer order through collecting and matching payment<\/td><\/tr><tr><td>Requirement<\/td><td>Clear statement of a needed outcome or behaviour<\/td><\/tr><tr><td>Business rule<\/td><td>Policy or condition governing a business decision or action<\/td><\/tr><tr><td>Control<\/td><td>Check or restriction that prevents or detects an error<\/td><\/tr><tr><td>Exception<\/td><td>Situation requiring handling outside the normal flow<\/td><\/tr><tr><td>Root-cause hypothesis<\/td><td>Possible underlying explanation still requiring evidence<\/td><\/tr><tr><td>Acceptance criterion<\/td><td>Observable condition for judging whether a requirement is met<\/td><\/tr><tr><td>KPI<\/td><td>Key performance indicator: defined measure used to monitor performance<\/td><\/tr><tr><td>UAT<\/td><td>User acceptance testing: checking whether a solution meets business needs<\/td><\/tr><tr><td>Traceability<\/td><td>Links connecting problems, requirements, design and validation<\/td><\/tr><tr><td>ERP<\/td><td>Enterprise resource planning: software supporting connected business activities and records<\/td><\/tr><tr><td>BRD<\/td><td>Business requirements document: explanation of business needs, scope and requirements<\/td><\/tr><tr><td>AS-IS / TO-BE<\/td><td>Current process / proposed future process<\/td><\/tr><tr><td>Backlog<\/td><td>Prioritised collection of work or product needs<\/td><\/tr><tr><td>User story<\/td><td>Short statement of a user&#x27;s need and its business value<\/td><\/tr><tr><td>Goods-issue posting<\/td><td>System record of an outbound stock movement; exact SAP effects require verification<\/td><\/tr><tr><td>Payment allocation<\/td><td>Matching received money to the correct invoice or account<\/td><\/tr><tr><td>Synthetic data<\/td><td>Artificial records generated for analysis or testing<\/td><\/tr><tr><td>Edition / release<\/td><td>Product offering and operating model / version of that offering<\/td><\/tr><tr><td>Fit-to-standard<\/td><td>Comparing business needs with standard system/process capabilities<\/td><\/tr><\/tbody><\/table><\/div>\n<p>These are learning definitions, not a verified SAP capability register.<\/p>\n<h2>Terms introduced in the full build<\/h2>\n<div class=\"scroll\"><table><thead><tr><th>Term<\/th><th>Meaning<\/th><\/tr><\/thead><tbody><tr><td>Grain<\/td><td>What one data row represents<\/td><\/tr><tr><td>Primary / foreign key<\/td><td>Unique row identifier / reference to another table&#x27;s row<\/td><\/tr><tr><td>Fan-out<\/td><td>Multiplication of parent rows when several child tables are joined<\/td><\/tr><tr><td>Business partner<\/td><td>Common identity and role-specific master information; see SAP-005<\/td><\/tr><tr><td>ATP<\/td><td>Available to promise: date/quantity confirmation concept; see SAP-002<\/td><\/tr><tr><td>PGI<\/td><td>Post goods issue; recording an outbound stock movement, not customer receipt<\/td><\/tr><tr><td>Receivable<\/td><td>Amount owed by a customer<\/td><\/tr><tr><td>Partial payment<\/td><td>Payment linked to an invoice while original invoice remains open; see SAP-006<\/td><\/tr><tr><td>Residual item<\/td><td>Remaining balance item after clearing the original invoice; see SAP-006<\/td><\/tr><tr><td>On-account payment<\/td><td>Payment recorded without matching a particular invoice<\/td><\/tr><tr><td>RACI<\/td><td>Responsible, Accountable, Consulted and Informed responsibilities<\/td><\/tr><tr><td>Segregation of duties<\/td><td>Separating conflicting actions, such as requesting and approving release<\/td><\/tr><tr><td>Capacity released<\/td><td>Staff time available for other work; not necessarily cash saved<\/td><\/tr><tr><td>Severity / priority<\/td><td>Impact of a defect / urgency of resolving it<\/td><\/tr><tr><td>Configuration / extension<\/td><td>Setting standard behaviour / adding capability beyond the chosen standard<\/td><\/tr><\/tbody><\/table><\/div>"}, {"path": "registers/progress.md", "html": "<h1>Current progress — 11 October 2026<\/h1>\n<p>Independent simulated portfolio. Full artifact build authorized by the user. Deliverable creation does not establish learner mastery, stakeholder approval or production readiness.<\/p>\n<div class=\"scroll\"><table><thead><tr><th>Phase<\/th><th>Artifact status<\/th><th>Validation / limitation<\/th><\/tr><\/thead><tbody><tr><td>1 Charter and plan<\/td><td>Built; original charter preserved with supersession note<\/td><td>SAP access, actual study hours and target role remain unknown<\/td><\/tr><tr><td>2 Discovery<\/td><td>Built<\/td><td>Explicit role-play; no people interviewed<\/td><\/tr><tr><td>3 AS-IS<\/td><td>Built<\/td><td>Hypotheses and fictional tools; process flowchart, not BPMN<\/td><\/tr><tr><td>4 Requirements<\/td><td>Built<\/td><td>23 requirements, 12 rules; no stakeholder approval<\/td><\/tr><tr><td>5 SAP / TO-BE<\/td><td>Built<\/td><td>Public Edition 2602 reference; seven reviewed sources and two unverified pages<\/td><\/tr><tr><td>6 Fit-gap<\/td><td>Built<\/td><td>Desk-based; no tenant demonstration<\/td><\/tr><tr><td>7 Backlog<\/td><td>Built<\/td><td>15 proposed stories; not delivered SAP functionality<\/td><\/tr><tr><td>8 Data and KPIs<\/td><td>Built and executed<\/td><td>300 synthetic orders; six Python/SQL KPIs; data-check evidence available<\/td><\/tr><tr><td>9 UAT<\/td><td>Design built<\/td><td>22 SAP cases Not executed; separate desk walkthrough/data checks<\/td><\/tr><tr><td>10 Risks/change/case<\/td><td>Built<\/td><td>Ten open risks; illustrative cost/capacity assumptions<\/td><\/tr><tr><td>11 Packaging<\/td><td>Built<\/td><td>Offline viewer, editable files, presentation and case study; not published<\/td><\/tr><tr><td>12 Resume/interview<\/td><td>Conditional drafts built<\/td><td>Actual learner contribution and oral review still pending<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Outstanding quality gates<\/h2>\n<p>- Learner answers and independent explanation have not been reviewed.<\/p>\n<p>- SAP access is unknown; no paid access required or purchased.<\/p>\n<p>- No real discovery, policy agreement, configured system tests or business acceptance.<\/p>\n<p>- Data is single-line, net-only and synthetic; receipt integration and exact audit coverage unresolved.<\/p>\n<p>- Real local Chromium checks and actual screenshots are recorded in quality/browser-checks.json; LibreOffice visual rendering remains unverified. The browser record identifies the exact tested HTML hash.<\/p>\n<p>Artifact preparation is complete subject to the recorded checks and limitations. The project must not be labelled fully complete under the original final gate until learner understanding is reviewed. It is not production ready.<\/p>\n<h2>Handover update — 12 October 2026<\/h2>\n<p>Actual local Chromium checks and nine UI screenshots completed. Root index.html, local-server script, GitHub Pages guide and PDF handover added. No remote publishing occurred. Exact test timing and current source hashes are in quality/browser-checks.json.<\/p>"}, {"path": "quality/final-quality-gate.md", "html": "<h1>Final quality gate — 11 October 2026<\/h1>\n<p>Independent simulated portfolio. <strong>Artifacts prepared; original project completion gate remains open. Not production ready.<\/strong><\/p>\n<h2>Executed evidence<\/h2>\n<p>24 Python/SQLite synthetic-data checks passed. Six KPI calculations agree before rounding. Sixteen catalogue consistency checks below passed. These are data/document checks, not SAP UAT. Office files are reopened and the offline viewer receives JavaScript logic smoke checks in the packaging step; see artifact-checks.json. Actual local Chromium rendering and 20 UI checks are recorded in browser-checks.json, with screenshots and the tested HTML hash. Real role permissions and LibreOffice visual checks were not performed.<\/p>\n<div class=\"scroll\"><table><thead><tr><th>ID<\/th><th>Check<\/th><th>Result<\/th><th>Evidence<\/th><\/tr><\/thead><tbody><tr><td>QC-001<\/td><td>Catalogue unique IDs<\/td><td>Passed<\/td><td>3 BR + 15 FR + 5 NFR; 15 stories; 22 test designs<\/td><\/tr><tr><td>QC-002<\/td><td>All three business problems traced<\/td><td>Passed<\/td><td>Every supplied problem has a trace row<\/td><\/tr><tr><td>QC-003<\/td><td>Every functional requirement traced<\/td><td>Passed<\/td><td>No functional requirement missing from trace<\/td><\/tr><tr><td>QC-004<\/td><td>Story/test references valid<\/td><td>Passed<\/td><td>All story requirement and test references resolve<\/td><\/tr><tr><td>QC-005<\/td><td>Trace and test bidirectional<\/td><td>Passed<\/td><td>Trace test links include the same requirement<\/td><\/tr><tr><td>QC-006<\/td><td>All tests link valid requirements<\/td><td>Passed<\/td><td>No dangling test requirements<\/td><\/tr><tr><td>QC-007<\/td><td>All NFRs covered<\/td><td>Passed<\/td><td>All five NFRs linked to planned cases<\/td><\/tr><tr><td>QC-008<\/td><td>SAP execution labels honest<\/td><td>Passed<\/td><td>No invented test result or SAP defect<\/td><\/tr><tr><td>QC-009<\/td><td>Seven exceptions covered<\/td><td>Passed<\/td><td>Includes positive and negative partial-delivery permission; pre/post dispatch cancellation<\/td><\/tr><tr><td>QC-010<\/td><td>Rules and process change IDs<\/td><td>Passed<\/td><td>All 12 rules referenced; 15 unique changes<\/td><\/tr><tr><td>QC-011<\/td><td>Fit assessment covers FRs<\/td><td>Passed<\/td><td>15 desk-based fit assessments; no claimed tenant demo<\/td><\/tr><tr><td>QC-012<\/td><td>Source evidence completeness<\/td><td>Passed<\/td><td>Official URLs/access date and demonstration boundary recorded<\/td><\/tr><tr><td>QC-013<\/td><td>Unverified sources explicit<\/td><td>Passed<\/td><td>Two unreadable Help pages not treated as verified capability<\/td><\/tr><tr><td>QC-014<\/td><td>Synthetic data checks passed<\/td><td>Passed<\/td><td>24 checks incl. independent Python/SQL and hand-calculated fixture<\/td><\/tr><tr><td>QC-015<\/td><td>Required files present<\/td><td>Passed<\/td><td>Core narratives/maps exist<\/td><\/tr><tr><td>QC-016<\/td><td>Learning questions retained<\/td><td>Passed<\/td><td>All twelve learning reviews present; none marked passed<\/td><\/tr><\/tbody><\/table><\/div>\n<h2>Manual desk review<\/h2>\n<p>Requirements address the three supplied problems; core exception paths appear in both flowcharts and planned tests. PC changes map to the named requirements and proposed stories. Seven exception categories have test coverage. Standard-process claims cite the SAP evidence register; two unreadable pages remain unverified. Business targets have not been achieved. Financial amounts are explicitly net-only, and capacity assumptions are not cash savings.<\/p>\n<h2>Remaining weaknesses<\/h2>\n<p>1. Learner answers, personal contribution and independent explanation have not been reviewed. Conditional resume descriptions cannot yet be used as personal execution claims.<\/p>\n<p>2. Discovery and policies are invented role-play. No stakeholders have validated priorities, ownership, thresholds or acceptance.<\/p>\n<p>3. SAP is a documentation reference: no tenant, configuration, authorization, integration or UAT evidence. All 22 SAP cases remain Not executed.<\/p>\n<p>4. Synthetic data is single-line and net-only; VAT, corrections, returns and the full SAP journal/open-item model are absent. These need broader modelling for a real project.<\/p>\n<p>5. Receipt capture, audit retention and exact billing/credit controls remain unresolved. Learning pages are not release-pinned even though the reference PDF is 2602.<\/p>\n<p>6. Viewer is read-only learning software with embedded synthetic data. It does not enforce production authorization or implement the transactional requirements. Actual local browser checks are recorded separately; Office visual QA, other-browser coverage and comprehensive accessibility/security review remain outstanding.<\/p>\n<p>7. Business-case volumes, handling minutes and costs are illustrative. No cash ROI, achieved benefit or investment approval is claimed.<\/p>\n<h2>Honest completion statement<\/h2>\n<p>The requested twelve-phase artifact pack is built. Production readiness is not established, and full portfolio completion under the user&#x27;s original gate requires the learner to explain key decisions without a script. Use the phase learning reviews next, then revise personal claims to match actual work completed.<\/p>"}, {"path": "quality/ui-issues.md", "html": "<h1>Portfolio application issues and changes<\/h1>\n<p>These relate to the actual locally built portfolio viewer, not SAP UAT defects. No production system or stakeholder test is represented.<\/p>\n<div class=\"scroll\"><table><thead><tr><th>ID<\/th><th>Observation<\/th><th>Change<\/th><th>Verification<\/th><\/tr><\/thead><tbody><tr><td>UIISS-001<\/td><td>Real Chromium test: searching FR-004 also returned NFR-004 because the ID matched a substring<\/td><td>Recognize a complete BR/FR/NFR identifier and use exact ID matching; retain keyword/fragment search otherwise<\/td><td>Retest recorded in browser-checks.json when current-source checks pass<\/td><\/tr><tr><td>UIISS-002<\/td><td>Initial navigation focus scrolled the overview past its top; order details appeared after a 300-row list<\/td><td>Prevent focus-induced scrolling; reset navigation to top; place detail panels before lists<\/td><td>Screenshot inspection and browser navigation test<\/td><\/tr><tr><td>UIISS-003<\/td><td>Changing a filter could leave a previously selected record displayed above unrelated results<\/td><td>Clear detail panels when search/status filters change<\/td><td>Browser no-result and subsequent detail checks<\/td><\/tr><\/tbody><\/table><\/div>\n<p>No user preference or operational outcome was inferred from these fixes. The browser evidence file records the source hashes tested after corrections.<\/p>"}], "maps": {"asis": "<svg width=\"1162pt\" height=\"1098pt\"\n viewBox=\"0.00 0.00 1162.00 1098.00\" xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\">\n<g id=\"graph0\" class=\"graph\" transform=\"scale(1 1) rotate(0) translate(18 1080)\">\n<title>process<\/title>\n<polygon fill=\"white\" stroke=\"transparent\" points=\"-18,18 -18,-1080 1144,-1080 1144,18 -18,18\"/>\n<!-- A -->\n<g id=\"node1\" class=\"node\">\n<title>A<\/title>\n<path fill=\"#eaf3f7\" stroke=\"#397187\" d=\"M770,-1062C770,-1062 612,-1062 612,-1062 606,-1062 600,-1056 600,-1050 600,-1050 600,-1038 600,-1038 600,-1032 606,-1026 612,-1026 612,-1026 770,-1026 770,-1026 776,-1026 782,-1032 782,-1038 782,-1038 782,-1050 782,-1050 782,-1056 776,-1062 770,-1062\"/>\n<text text-anchor=\"middle\" x=\"691\" y=\"-1041.2\" font-family=\"DejaVu Sans\" font-size=\"11.00\">Sales: receive customer order<\/text>\n<\/g>\n<!-- B -->\n<g id=\"node2\" class=\"node\">\n<title>B<\/title>\n<path fill=\"#eaf3f7\" stroke=\"#397187\" d=\"M568.12,-991.28C568.12,-991.28 467.55,-976.72 467.55,-976.72 461.62,-975.86 461.62,-974.14 467.55,-973.28 467.55,-973.28 568.12,-958.72 568.12,-958.72 574.06,-957.86 585.94,-957.86 591.88,-958.72 591.88,-958.72 692.45,-973.28 692.45,-973.28 698.38,-974.14 698.38,-975.86 692.45,-976.72 692.45,-976.72 591.88,-991.28 591.88,-991.28 585.94,-992.14 574.06,-992.14 568.12,-991.28\"/>\n<text text-anchor=\"middle\" x=\"580\" y=\"-972.2\" font-family=\"DejaVu Sans\" font-size=\"11.00\">Data and price correct?<\/text>\n<\/g>\n<!-- A&#45;&gt;B -->\n<g id=\"edge1\" class=\"edge\">\n<title>A&#45;&gt;B<\/title>\n<path fill=\"none\" stroke=\"#607887\" d=\"M662.7,-1025.92C647.24,-1016.59 628.03,-1004.99 612.02,-995.33\"/>\n<polygon fill=\"#607887\" stroke=\"#607887\" points=\"613.39,-992.06 603.02,-989.89 609.77,-998.06 613.39,-992.06\" function showOrder(id){if(current!=='orders')navigate('orders');const o=DATA.orders.find(x=>x.order_id===id);if(!o)return;const ds=DATA.deliveries.filter(d=>d.order_id===id),did=new Set(ds.map(d=>d.delivery_id)),invs=DATA.invoices.filter(i=>did.has(i.delivery_id)),iid=new Set(invs.map(i=>i.invoice_id)),als=DATA.allocations.filter(a=>iid.has(a.invoice_id));
el('detail').innerHTML=`<article class="panel detail"><p class="eyebrow">SYNTHETIC RECORD · NOT SAP</p><h2 tabindex="-1" id="detail-heading">${esc(id)}</h2><p>${esc(o.customer_name)} · ${esc(o.product_name)} · ${money(o.net_value_pence)} net order value</p><p>Requested receipt: <b>${esc(o.requested_receipt_date)}</b> · Initial confirmed receipt: <b>${esc(o.initial_confirmed_receipt_date||'Unknown / not confirmed')}</b></p><p>Ordered ${o.ordered_qty} · Dispatched ${o.shipped_qty} · Customer-received ${o.received_qty}. ${o.order_id==='NS-ORD-1001'?'60 units physically on hand; usable/uncommitted stock remains unresolved.':''}</p><h3>Shipments and distinct events</h3>${ds.length?grid(['Delivery','Quantity','Physical dispatch','Goods-issue posting','Customer receipt'],ds.map(d=>row([esc(d.delivery_id),d.shipped_qty,esc(d.dispatch_date),esc(d.goods_issue_posting_date||'Not observed'),esc(d.customer_receipt_date||'Not observed')]))):'<p>No shipment records.</p>'}<h3>Invoices and analytical allocations</h3>${invs.length?grid(['Invoice','Created','Net-only amount','Allocated','Analytical remaining'],invs.map(i=>{const paid=als.filter(a=>a.invoice_id===i.invoice_id).reduce((s,a)=>s+a.allocated_pence,0);return row([esc(i.invoice_id),esc(i.invoice_date),money(i.net_amount_pence),money(paid),money(i.net_amount_pence-paid)]);} )):'<p>No invoice or allocation records.</p>'}<p class="muted">Net-only teaching model excludes VAT. An analytical remaining amount does not establish SAP invoice-clearing status. Receipt evidence is not inferred from goods issue.</p></article>`;el('detail-heading').focus();el('detail').scrollIntoView({behavior:'smooth',block:'start'});}
function requirementsView(){return header('PROBLEM → REQUIREMENT → STORY → TEST','Requirements & traceability','23 requirements, 15 functional process changes and 15 proposed stories. Select a requirement to inspect its rationale and linked validation.')+`<label>Search requirements<input id="req-search" type="search" placeholder="Try partial, credit or FR-004"></label><div id="req-detail"></div><div id="req-table"></div>`;}
function drawRequirements(){el('req-detail').innerHTML='';const q=(el('req-search')?.value||'').trim().toLowerCase();const exactId=/^(br|fr|nfr)-\d{3}$/.test(q);const rs=DATA.catalog.requirements.filter(r=>exactId?r.ID.toLowerCase()===q:`${r.ID} ${r.Statement} ${r.Type}`.toLowerCase().includes(q));el('req-table').innerHTML=grid(['ID','Type','Statement','Priority'],rs.map(r=>row([`<button class="link" data-req="${r.ID}">${r.ID}</button>`,esc(r.Type),esc(r.Statement),badge(r.Priority)])));}
function showRequirement(id){const r=DATA.catalog.requirements.find(x=>x.ID===id);if(!r)return;const tr=DATA.catalog.trace.find(x=>x.Requirement===id);const tests=DATA.catalog.tests.filter(x=>x.Requirements.split(';').includes(id));el('req-detail').innerHTML=`<article class="panel"><h2 tabindex="-1" id="req-heading">${esc(id)}</h2><p>${esc(r.Statement)}</p><h3>Business rationale</h3><p>${esc(r.Rationale)}</p><h3>Acceptance criteria</h3><p>${esc(r.Acceptance)}</p><h3>Dependencies and validation</h3><p>${esc(r.Dependencies)}</p><p>${esc(r.Validation)}</p>${tr?`<div class="notice">${esc(tr.Problem)} → ${esc(tr.Business_requirement)} → ${esc(tr.Requirement)} → ${esc(tr.Process_change)} → ${esc(tr.Story)} → ${esc(tr.Tests)} → ${esc(tr.KPI)}</div>`:''}<p>Direct linked cases: ${tests.map(t=>esc(t.ID)).join(', ')||'See transitive business traceability'}. No stakeholder approval recorded.</p></article>`;el('req-heading').focus();}
function uatView(){return header('DESIGNED ≠ EXECUTED','UAT & validation','All SAP cases remain Not executed. Executed synthetic-data checks are separate evidence.')+`<div class="three"><article class="metric"><span>Planned SAP cases</span><strong>22</strong></article><article class="metric"><span>SAP cases executed</span><strong>0</strong></article><article class="metric"><span>Data checks passed</span><strong>${DATA.results.context.checks}</strong></article></div>`+DATA.catalog.tests.map(t=>`<details><summary>${esc(t.ID)} · ${esc(t.Scenario)} ${badge(t.Status)}</summary><p><b>Requirements:</b> ${esc(t.Requirements)}</p><p><b>Preconditions:</b> ${esc(t.Preconditions)}</p><p><b>Data:</b> ${esc(t.Test_data)}</p><p><b>Steps:</b> ${esc(t.Steps)}</p><p><b>Expected:</b> ${esc(t.Expected_results)}</p><p><b>Actual:</b> ${esc(t.Actual_results)} · Evidence: ${esc(t.Evidence_reference)} · Defect: ${esc(t.Defect_reference)}</p></details>`).join('');}
function evidenceView(){return header('OFFICIAL SOURCES, EXPLICIT LIMITS','SAP evidence register','Public Edition 2602 is the reference. Learning pages are not release-pinned. No source has been demonstrated in a tenant.')+DATA.catalog.evidence.map(e=>`<article class="panel"><p>${badge(e.Verification)} · ${esc(e.ID)} · accessed ${esc(e.Access_date)}</p><h2><a href="${esc(e.URL)}" target="_blank" rel="noopener noreferrer">${esc(e.Title)} ↗</a></h2><p>${esc(e.Claim)}</p><p><b>Locate:</b> ${esc(e.Locator)}</p><p class="muted">${esc(e.Limit)}</p></article>`).join('');}
function processView(){return header('CURRENT → PROPOSED','Process & ownership','Process flowcharts, not BPMN. Diagrams show decision and exception paths; tools and current-state details are fictional assumptions.')+`<div class="tabs"><button data-map="asis" aria-pressed="true">AS-IS</button><button data-map="tobe" aria-pressed="false">TO-BE</button></div><div id="process-map" class="panel diagram">${DATA.maps.asis}</div><p class="muted">Use browser zoom to inspect the diagram. Sales owns promises; Warehouse owns fulfilment evidence; Finance owns credit, billing and payment control. Customer Service owns customer communication.</p>`;}
function analysisView(){const d=DATA.docs.find(d=>d.path==='phase-08/analysis.md');return header('REPRODUCIBLE, SYNTHETIC ANALYSIS','Data & KPI definitions','One row must have one clear meaning. Aggregate child records before combining order-level measures.')+`<div class="panel chart">${DATA.chart}</div>`+grid(['KPI','Formula','Population','Limitations'],DATA.kpis.map(k=>row([esc(k.ID)+'<br>'+esc(k.Name),esc(k.Formula),esc(k.Denominator),esc(k.Exclusions_and_limitations)])))+`<article class="panel document">${d.html}</article>`;}
function libraryView(){return header('TWELVE PHASES, ONE EVIDENCE PACK','Portfolio library','Read the documents, exercise your understanding and inspect remaining quality gates. Draft artifacts do not establish personal mastery.')+`<article class="panel"><h2>Download and use the project</h2><p>${assetLink('downloads/NorthStar_Project_Guide.pdf','Project guide & real UI screenshots (PDF)')} · ${assetLink('downloads/NorthStar_Full_Portfolio.pdf','Full portfolio reference (PDF)')}</p><p>${assetLink('downloads/NorthStar_Complete_Workbook.xlsx','Editable workbook')} · ${assetLink('downloads/NorthStar_Executive_Presentation.pptx','Executive presentation')} · ${assetLink('RUN_LOCALLY.md','Local setup')} · ${assetLink('GITHUB_SETUP.md','GitHub setup')}</p><p class="muted">Download links need the complete project folder or hosted repository. Document reading and data exploration remain embedded in the standalone HTML.</p></article><label>Choose a document<select id="doc-select">${DATA.docs.map((d,i)=>`<option value="${i}">${esc(d.path)}</option>`).join('')}</select></label><article id="doc-body" class="panel document">${DATA.docs[0].html}</article>`;}
const views={overview,orders:ordersView,process:processView,requirements:requirementsView,uat:uatView,evidence:evidenceView,analysis:analysisView,library:libraryView};
function navigate(view){current=views[view]?view:'overview';el('content').innerHTML=views[current]();document.querySelectorAll('[data-view]').forEach(b=>{if(b.closest('nav'))b.setAttribute('aria-current',b.dataset.view===current?'page':'false');});if(current==='orders')drawOrders();if(current==='requirements')drawRequirements();el('content').focus({preventScroll:true});globalThis.scrollTo?.(0,0);}
function exportOrders(){const fields=['order_id','customer_name','ordered_qty','received_qty','net_value_pence','exception'];const quote=v=>'"'+String(v??'').replaceAll('"','""')+'"';const text=[fields,...selectedOrders().map(o=>fields.map(k=>o[k]))].map(r=>r.map(quote).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='northstar_filtered_synthetic_orders.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('click',e=>{const v=e.target.closest('[data-view]'),o=e.target.closest('[data-order]'),r=e.target.closest('[data-req]'),m=e.target.closest('[data-map]');if(v)navigate(v.dataset.view);else if(o)showOrder(o.dataset.order);else if(r)showRequirement(r.dataset.req);else if(m){el('process-map').innerHTML=DATA.maps[m.dataset.map];document.querySelectorAll('[data-map]').forEach(b=>b.setAttribute('aria-pressed',String(b===m)));}else if(e.target.closest('#export-orders'))exportOrders();});
document.addEventListener('input',e=>{if(e.target.id==='order-search')drawOrders();if(e.target.id==='req-search')drawRequirements();});
document.addEventListener('change',e=>{if(e.target.id==='order-status')drawOrders();if(e.target.id==='doc-select')el('doc-body').innerHTML=DATA.docs[Number(e.target.value)].html;});
navigate('overview');
</script></body></html>
